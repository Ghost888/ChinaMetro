<style>
  /* =====================================================================
     设计系统：语义化令牌 + iOS 式层级
     - 颜色：语义令牌（label/label-2/sep/fill），浅色与深色两套
     - 字号：iOS 文本风格阶梯，rem 基准，跟随浏览器字号缩放
     - 间距：4/8/12/16/20/24 网格；控件最小 44pt
     ===================================================================== */
  :root{
    color-scheme: light dark;
    --bg:#F4F1EA;
    --bg-elevated:#FFFFFF;
    --bg-sheet:#F8F5EF;
    --label:#15171B;
    --label-2:rgba(21,23,27,.62);
    --label-3:rgba(21,23,27,.36);
    --sep:rgba(21,23,27,.10);
    --sep-strong:rgba(21,23,27,.18);
    --fill-1:rgba(120,114,100,.08);
    --fill-2:rgba(120,114,100,.15);
    --tint:#C8102E;
    --ink:#15171B;
    --on-ink:#FFFFFF;
    --blue:#0A66D8;
    --green:#0E7C57;
    --orange:#A85000;
    --red:#C20D1B;
    --map-bg-a:#FBF8F1; --map-bg-b:#EFEBE1;
    --card-shadow:0 1px 2px rgba(20,18,14,.05),0 12px 32px -26px rgba(20,18,14,.55);
    --r-card:14px; --r-sheet:20px; --r-ctl:10px; --r-pill:999px;
    --glass-bg:rgba(250,248,243,.80);
    --glass:saturate(180%) blur(20px);
    --fs-large:2.125rem; --fs-title1:1.75rem; --fs-title2:1.375rem; --fs-title3:1.1875rem;
    --fs-headline:1.0625rem; --fs-body:1.0625rem; --fs-callout:1rem; --fs-subhead:.9375rem;
    --fs-footnote:.8125rem; --fs-caption1:.75rem; --fs-caption2:.6875rem;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121211;
      --bg-elevated:#1E1D1B;
      --bg-sheet:#1A1917;
      --label:#F2EFE8;
      --label-2:rgba(242,239,232,.64);
      --label-3:rgba(242,239,232,.38);
      --sep:rgba(242,239,232,.12);
      --sep-strong:rgba(242,239,232,.22);
      --fill-1:rgba(242,239,232,.07);
      --fill-2:rgba(242,239,232,.14);
      --ink:#F4F1EA;
      --on-ink:#15171B;
      --map-bg-a:#191817; --map-bg-b:#0E0E0D;
      --card-shadow:none;
      --glass-bg:rgba(26,25,23,.76);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    background:var(--bg);color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:var(--fs-body);line-height:1.45;font-optical-sizing:auto;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  b,strong{font-weight:650}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ---------------- 顶部工具栏（功能层） ---------------- */
  .top{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
    background:var(--glass-bg);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
    border-bottom:.5px solid var(--sep);z-index:5
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
  .brand>div{min-width:0}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,#D2112F,#8A0D1F);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:var(--fs-subhead);
    letter-spacing:-.4px;box-shadow:0 4px 12px -8px rgba(138,13,31,.9);flex:0 0 auto}
  .brand b{display:block;font-size:var(--fs-headline);font-weight:700;letter-spacing:-.2px;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:var(--fs-caption2);color:var(--label-2);margin-top:1px;
    letter-spacing:.2px;white-space:nowrap}
  .top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .citybtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 7px;
    border-radius:var(--r-pill);background:var(--fill-1);color:var(--label);cursor:pointer;
    transition:background .15s ease,transform .12s ease}
  .citybtn:active{background:var(--fill-2);transform:scale(.98)}
  .citybtn b{font-size:var(--fs-subhead);font-weight:650}
  .citybtn>span:last-child{color:var(--label-3);font-size:var(--fs-caption1);margin-left:-1px}
  .iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    color:var(--label-2);font-size:var(--fs-title3);transition:background .15s ease}
  .iconbtn:hover{background:var(--fill-1)}
  .iconbtn:active{background:var(--fill-2)}

  /* ---------------- 布局 ---------------- */
  .layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px 0 0}
  .map-wrap{position:relative;flex:0 0 auto;height:42vh;min-height:270px;margin:0 12px;
    border-radius:var(--r-card);overflow:hidden;border:.5px solid var(--sep);
    background:linear-gradient(180deg,var(--map-bg-a),var(--map-bg-b));box-shadow:var(--card-shadow)}
  svg#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;
    -webkit-user-select:none}
  svg#map.grabbing{cursor:grabbing}
  #gTiles image{opacity:.56}
  @media (prefers-color-scheme: dark){
    #gTiles image{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.85);opacity:.42}
    #gLabels text{fill:#EDEAE3;stroke:#0E0E0D}
    #gLabels text[data-onroute]{fill:#fff}
  }
  .mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
  .mapctl button{width:44px;height:44px;border-radius:50%;border:.5px solid var(--sep-strong);
    background:var(--glass-bg);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
    color:var(--label);font-size:var(--fs-title3);line-height:1;display:grid;place-items:center;
    box-shadow:0 6px 16px -12px rgba(0,0,0,.6);transition:transform .12s ease,background .15s ease}
  .mapctl button:active{transform:scale(.94)}
  .mapctl button.on{background:var(--ink);border-color:transparent;color:var(--on-ink)}
  .maptag{position:absolute;left:10px;top:10px;z-index:2;background:var(--glass-bg);
    -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
    border:.5px solid var(--sep);color:var(--label-2);font-size:var(--fs-caption1);font-weight:600;
    padding:6px 10px;border-radius:var(--r-pill);max-width:60%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .osm-attr{position:absolute;left:10px;bottom:10px;z-index:2;font-size:9.5px;line-height:1.35;
    color:var(--label-2);background:var(--glass-bg);-webkit-backdrop-filter:var(--glass);
    backdrop-filter:var(--glass);padding:3px 7px;border-radius:6px;text-decoration:none;
    max-width:56%;border:.5px solid var(--sep);word-break:break-word}
  .osm-attr.off{opacity:.35}
  .hint{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);z-index:3;
    background:rgba(20,20,19,.86);color:#fff;font-size:var(--fs-caption1);font-weight:600;
    padding:8px 14px;border-radius:var(--r-pill);white-space:nowrap;pointer-events:none;
    max-width:56%;overflow:hidden;text-overflow:ellipsis;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .hoverTip{position:absolute;z-index:4;pointer-events:none;background:var(--bg-elevated);
    border:.5px solid var(--sep);border-radius:var(--r-ctl);padding:6px 10px;
    font-size:var(--fs-caption1);color:var(--label);box-shadow:0 8px 24px -16px rgba(0,0,0,.6);
    display:none;white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis}
  .nearbtn{position:absolute;left:10px;bottom:40px;z-index:3;min-height:36px;
    border:.5px solid var(--sep-strong);border-radius:var(--r-pill);background:var(--glass-bg);
    -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
    color:var(--tint);font-size:var(--fs-caption1);font-weight:650;padding:6px 12px;
    box-shadow:0 6px 16px -12px rgba(0,0,0,.5);max-width:74%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .nearbtn[hidden]{display:none}

  /* ---------------- 面板 ---------------- */
  .panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 12px calc(24px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px}
  .panel>*{flex:0 0 auto}
  .card{background:var(--bg-elevated);border-radius:var(--r-card);border:.5px solid var(--sep);
    box-shadow:var(--card-shadow);overflow:hidden}

  /* 行程卡片 */
  .trip{display:flex;flex-direction:column;padding:0}
  .trow{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:54px}
  .trow+.trow{border-top:.5px solid var(--sep)}
  .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-size:var(--fs-caption2);font-weight:700;color:#fff;flex:0 0 auto}
  .dot.from{background:var(--ink);color:var(--on-ink)}
  .dot.to{background:var(--tint)}
  .dot.time{background:var(--label-3)}
  .field{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
  .field i{font-style:normal;font-size:var(--fs-caption2);color:var(--label-2);letter-spacing:.3px}
  .field b{font-size:var(--fs-body);font-weight:650;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .field b.empty{color:var(--label-3);font-weight:500}
  .swap{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--fill-1);
    display:grid;place-items:center;color:var(--label-2);font-size:var(--fs-body);
    transition:transform .15s ease,background .15s ease}
  .swap:active{transform:scale(.92);background:var(--fill-2)}
  .time-edit{display:flex;align-items:center;gap:8px;min-width:0}
  .time-edit input{flex:1;min-width:0;height:32px;border:0;background:transparent;
    font-size:var(--fs-body);font-weight:600;color:var(--label);padding:0}
  .time-edit input::-webkit-calendar-picker-indicator{opacity:.4}
  .pickbtn,.nowbtn{min-height:32px;padding:0 10px;border-radius:var(--r-pill);
    background:var(--fill-1);color:var(--label-2);font-size:var(--fs-caption1);font-weight:650;
    white-space:nowrap;transition:background .15s ease}
  .pickbtn{color:var(--blue)}
  .pickbtn:active,.nowbtn:active{background:var(--fill-2)}
  .opts{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:.5px solid var(--sep)}
  .opts label{font-size:var(--fs-footnote);color:var(--label-2);flex:0 0 auto}
  .opts select{flex:1;min-width:0;height:44px;border:.5px solid var(--sep);border-radius:var(--r-ctl);
    background:var(--bg);color:var(--label);padding:0 10px;font-size:var(--fs-subhead);
    font-weight:550}
  .planbtn{display:block;width:calc(100% - 32px);margin:4px 16px 16px;min-height:50px;
    border-radius:12px;background:var(--ink);color:var(--on-ink);
    font-size:var(--fs-body);font-weight:700;letter-spacing:.2px;
    transition:transform .12s ease,opacity .15s ease}
  .planbtn:active{transform:scale(.985);opacity:.92}

  /* 结果卡片 */
  .result{min-height:110px;padding:16px}
  .empty{color:var(--label-2);font-size:var(--fs-footnote);line-height:1.7}
  .empty b{color:var(--label);font-weight:650}
  .fareline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .fare .num{font-size:2.75rem;font-weight:750;letter-spacing:-1.8px;line-height:1;
    font-variant-numeric:tabular-nums}
  .faresub{font-size:var(--fs-caption1);color:var(--label-2);margin-top:2px}
  .fare .unit{font-size:var(--fs-subhead);font-weight:650;margin-left:3px;color:var(--label-2)}
  .sum{text-align:right;font-size:var(--fs-caption1);line-height:1.6;color:var(--label-2)}
  .sum b{color:var(--label);font-size:var(--fs-headline);font-weight:700;
    font-variant-numeric:tabular-nums}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .badge{font-size:var(--fs-caption1);font-weight:600;background:var(--fill-1);color:var(--label-2);
    border-radius:8px;padding:4px 8px}
  .badge.ok{background:rgba(14,124,87,.12);color:var(--green)}
  .badge.warn{background:rgba(194,13,27,.10);color:var(--red)}
  .badge.info{background:rgba(10,102,216,.10);color:var(--blue)}
  .alt{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .alt button{min-height:40px;min-width:64px;border:.5px solid var(--sep);border-radius:11px;
    background:var(--bg);color:var(--label);padding:7px 10px;line-height:1.25;
    display:flex;flex-direction:column;align-items:flex-start;gap:1px;transition:all .15s ease}
  .alt button b{font-size:var(--fs-caption1);font-weight:700}
  .alt button em{font-style:normal;font-size:var(--fs-caption2);color:var(--label-2)}
  .alt button.on{background:var(--ink);border-color:transparent;color:var(--on-ink)}
  .alt button.on em{color:rgba(255,255,255,.72)}
  @media (prefers-color-scheme: dark){ .alt button.on em{color:rgba(21,23,27,.62)} }
  .legs{margin-top:14px;border-top:.5px solid var(--sep);padding-top:6px}
  .leg{display:flex;gap:12px;padding:12px 0;border-bottom:.5px solid var(--sep)}
  .leg:last-child{border-bottom:0}
  .leg .rail{width:3px;border-radius:2px;flex:0 0 auto;background:var(--fill-2);margin-top:3px}
  .leg .body{flex:1;min-width:0}
  .leg .head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lc{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 7px;
    border-radius:6px;color:#fff;font-size:var(--fs-caption2);font-weight:750;letter-spacing:.2px;
    white-space:nowrap}
  .lc.dark{color:#15171B}
  .leg .route{font-size:var(--fs-footnote);font-weight:650;color:var(--label)}
  .leg .meta{font-size:var(--fs-caption1);color:var(--label-2);margin-top:3px;line-height:1.55}
  .leg .times{font-size:var(--fs-caption2);color:var(--label-3);margin-top:2px;
    font-variant-numeric:tabular-nums}
  .leg.trans .body{font-size:var(--fs-caption1);color:var(--label-2);line-height:1.6}
  .leg.trans .rail{background:transparent;border-left:2px dotted var(--sep-strong)}
  .stopsbox{margin-top:6px}
  .stopsbox summary{cursor:pointer;font-size:var(--fs-caption1);color:var(--blue);
    font-weight:600;list-style:none}
  .stopsbox summary::-webkit-details-marker{display:none}
  .stopsbox summary::after{content:"展开";color:var(--label-3);font-weight:500;margin-left:6px}
  .stopsbox[open] summary::after{content:"收起"}
  .stopsbox ol{margin:6px 0 0 16px;padding:0;font-size:var(--fs-caption1);
    color:var(--label-2);line-height:1.9}
  .warn{margin-top:12px;padding:10px 12px;border-radius:var(--r-ctl);
    background:rgba(194,13,27,.09);color:var(--red);font-size:var(--fs-footnote);line-height:1.6}
  .note{font-size:var(--fs-caption1);color:var(--label-3);line-height:1.6;margin-top:10px}

  /* 数据概览 */
  .facts{padding:16px}
  .facts h3{margin:0 0 10px;font-size:var(--fs-subhead);font-weight:700;color:var(--label)}
  .factgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .fact{background:var(--fill-1);border-radius:var(--r-ctl);padding:9px 10px}
  .fact b{display:block;font-size:var(--fs-title3);font-weight:700;letter-spacing:-.3px;
    font-variant-numeric:tabular-nums}
  .fact span{font-size:var(--fs-caption2);color:var(--label-2)}
  .factnote{font-size:var(--fs-caption1);color:var(--label-2);line-height:1.65;margin-top:12px}
  .datafoot{font-size:var(--fs-caption2);color:var(--label-3);line-height:1.6;padding:0 4px}

  /* ---------------- 半模态面板（sheet） ---------------- */
  .mask{position:fixed;inset:0;background:rgba(8,8,8,.44);z-index:20;display:none;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:0;transition:opacity .22s ease}
  .mask.on{display:block;opacity:1}
  .sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;display:none;flex-direction:column;
    background:var(--bg-sheet);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    max-height:86vh;max-height:86dvh;
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -22px 56px -26px rgba(0,0,0,.55)}
  .sheet.on{display:flex;animation:sheetUp .32s cubic-bezier(.32,.72,0,1)}
  @keyframes sheetUp{from{transform:translateY(14px);opacity:.55}to{transform:none;opacity:1}}
  .sheet-grab{width:36px;height:5px;border-radius:3px;background:var(--label-3);
    margin:8px auto 0;flex:0 0 auto;opacity:.65}
  .sheet-titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:6px 16px 2px;flex:0 0 auto}
  .sheet-titlebar h2{margin:0;font-size:var(--fs-headline);font-weight:700;letter-spacing:-.2px}
  .textbtn{min-height:44px;padding:0 4px;color:var(--blue);font-size:var(--fs-body);
    font-weight:600;white-space:nowrap}
  .textbtn.done{font-weight:700}
  .sheet-head{padding:6px 16px 10px;flex:0 0 auto}
  .sheet-head input{width:100%;height:44px;border-radius:var(--r-ctl);border:.5px solid var(--sep);
    background:var(--bg-elevated);color:var(--label);padding:0 14px;font-size:var(--fs-body);
    outline:none;transition:border-color .15s ease,box-shadow .15s ease}
  .sheet-head input::placeholder{color:var(--label-3)}
  .sheet-head input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,102,216,.15)}
  .sheet-title{padding:6px 16px 2px;font-size:var(--fs-footnote);color:var(--label-2);
    font-weight:600;flex:0 0 auto}

  .list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 20px;
    overscroll-behavior:contain}
  .item{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 12px;
    border-radius:12px;cursor:pointer;transition:background .12s ease}
  .item:active{background:var(--fill-1)}
  .item .nm{font-size:var(--fs-callout);font-weight:600;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .item .sub{font-size:var(--fs-caption1);color:var(--label-2);margin-top:2px}
  .item .right{margin-left:auto;text-align:right;font-size:var(--fs-caption1);
    color:var(--label-3);flex:0 0 auto}
  .item .lines{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
  .group{padding:16px 12px 6px;font-size:var(--fs-footnote);color:var(--label-2);font-weight:650;
    letter-spacing:.2px}

  /* 时间选择 */
  .timepicker{padding:4px 16px 18px;overflow-y:auto}
  .timepicker .tpdate{display:flex;align-items:center;gap:8px;padding:6px 0 12px}
  .timepicker .tpdate input{flex:1;height:44px;border:.5px solid var(--sep);background:var(--bg-elevated);
    border-radius:var(--r-ctl);padding:0 12px;font-size:var(--fs-callout);color:var(--label)}
  .tp-preview{font-size:var(--fs-title2);font-weight:750;letter-spacing:-.6px;margin:2px 0 10px;
    font-variant-numeric:tabular-nums}
  .tp-label{font-size:var(--fs-caption1);color:var(--label-2);margin:12px 0 6px;font-weight:600}
  .tp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .tp-grid button{min-height:40px;border:.5px solid var(--sep);background:var(--bg-elevated);
    border-radius:9px;font-size:var(--fs-footnote);color:var(--label);transition:all .12s ease}
  .tp-grid button:active{transform:scale(.96)}
  .tp-grid button.on{background:var(--ink);border-color:transparent;color:var(--on-ink)}
  .tp-grid.minutes button{font-size:var(--fs-caption1)}
  .tp-actions{display:flex;gap:10px;margin-top:16px}
  .tp-actions button{flex:1;min-height:48px;border:.5px solid var(--sep);background:var(--bg-elevated);
    border-radius:12px;font-size:var(--fs-callout);font-weight:650;color:var(--label)}
  .tp-actions button.primary{background:var(--ink);border-color:transparent;color:var(--on-ink)}

  /* 数据说明 */
  .info{padding:4px 16px 28px;overflow-y:auto;overscroll-behavior:contain}
  .info h2{margin:8px 0 6px;font-size:var(--fs-title2);font-weight:750;letter-spacing:-.4px}
  .info h3{margin:20px 0 8px;font-size:var(--fs-footnote);color:var(--label-2);font-weight:650;
    letter-spacing:.3px;text-transform:none}
  .info p,.info li{font-size:var(--fs-footnote);line-height:1.75;color:var(--label-2)}
  .info table{width:100%;border-collapse:collapse;font-size:var(--fs-caption1);margin-top:6px}
  .info td{padding:9px 2px;border-bottom:.5px solid var(--sep);vertical-align:top;
    color:var(--label-2)}
  .info td:last-child{text-align:right;white-space:nowrap;color:var(--label-3)}
  .info code{font-size:var(--fs-caption2);background:var(--fill-1);padding:1px 5px;border-radius:4px}

  /* ---------------- 城市徽标 ---------------- */
  .citymark{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;
    flex:0 0 auto;color:#fff;font-size:9.5px;font-weight:750;letter-spacing:-.3px;line-height:1;overflow:hidden;white-space:nowrap;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
  .item .citymark{width:32px;height:32px;font-size:10.5px}
  .citymark.logo{background:#fff;padding:3px;overflow:hidden;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(21,23,27,.10),0 1px 2px rgba(0,0,0,.06)}
  .citymark.logo img{width:100%;height:100%;object-fit:contain;display:block}
  @media (prefers-color-scheme: dark){ .citymark.logo{background:#F4F1EA} }

  /* ---------------- 我的位置 · 指向起点 ---------------- */
  .mapctl button.locating{background:var(--blue);border-color:transparent;color:#fff}
  .compass-fab{position:absolute;right:12px;bottom:12px;z-index:4;width:62px;height:62px;
    border-radius:50%;border:.5px solid var(--sep-strong);background:var(--glass-bg);
    -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);color:var(--label);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 10px 24px -14px rgba(20,18,14,.7);transition:transform .12s cubic-bezier(.2,.8,.3,1)}
  .compass-fab[hidden]{display:none}
  .compass-fab:active{transform:scale(.94)}
  .compass-fab .arw{display:grid;place-items:center;width:24px;height:24px;
    transform-origin:50% 50%;will-change:transform}
  .compass-fab .dst{font-size:9px;font-weight:700;letter-spacing:.1px;color:var(--label-2);
    max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-variant-numeric:tabular-nums;margin-top:-1px}
  .compass-fab.idle .dst{color:var(--tint)}

  .findme{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
    background:radial-gradient(120% 80% at 50% 16%,#68bf6c 0%,#47a457 44%,#2b783c 100%);
    color:#fff;padding:calc(16px + env(safe-area-inset-top)) 24px calc(26px + env(safe-area-inset-bottom))}
  .findme.on{display:flex;animation:fmIn .26s cubic-bezier(.2,.8,.3,1)}
  @keyframes fmIn{from{opacity:0;transform:scale(.986)}to{opacity:1;transform:none}}
  .fm-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .fm-kicker{font-size:var(--fs-caption1);letter-spacing:2.4px;opacity:.78;font-weight:700}
  .fm-name{font-size:1.375rem;font-weight:800;letter-spacing:-.3px;margin-top:3px;line-height:1.2}
  .fm-close{all:unset;box-sizing:border-box;width:46px;height:46px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:1.0625rem;
    color:#fff;flex:0 0 auto;background:rgba(255,255,255,.08);
    transition:background .15s ease,transform .12s ease;text-align:center}
  .fm-close:active{transform:scale(.94);background:rgba(255,255,255,.18)}
  .fm-stage{flex:1;display:grid;place-items:center;min-height:0}
  .fm-ring{position:relative;width:min(74vw,340px);aspect-ratio:1;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.30);display:grid;place-items:center}
  .fm-ring::before{content:"";position:absolute;inset:-1px;border-radius:50%;
    border:2px solid rgba(255,255,255,.22);animation:fmPulse 3.4s ease-out infinite}
  .fm-ring::after{content:"";position:absolute;inset:15%;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.14)}
  @keyframes fmPulse{0%{transform:scale(1);opacity:.5}65%{transform:scale(1.055);opacity:0}100%{opacity:0}}
  .fm-arrow{width:min(45vw,150px);height:min(45vw,150px);color:#fff;transform-origin:50% 50%;
    will-change:transform;filter:drop-shadow(0 10px 22px rgba(0,0,0,.22))}
  .fm-dot{position:absolute;top:-7px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;
    background:#fff;transform-origin:50% calc(min(74vw,340px)/2 + 7px);will-change:transform;
    box-shadow:0 0 0 4px rgba(255,255,255,.16)}
  .fm-bottom{padding-top:6px}
  .fm-label{font-size:var(--fs-caption1);font-weight:600;letter-spacing:.5px;opacity:.72;
    margin-bottom:1px}
  .fm-dist{font-size:clamp(34px,9vw,50px);font-weight:800;letter-spacing:-1.8px;line-height:1.08;
    font-variant-numeric:tabular-nums}
  .fm-sub{font-size:1rem;font-weight:650;opacity:.94;margin-top:6px;letter-spacing:.1px}
  .fm-note{font-size:var(--fs-caption1);opacity:.68;margin-top:14px;line-height:1.65;max-width:34em}

  /* ---------------- 响应式 ---------------- */
  @media (min-width:980px){
    .layout{flex-direction:row;gap:14px;padding:14px 20px 20px;align-items:stretch}
    .map-wrap{flex:1;height:auto;min-height:0;margin:0}
    .panel{width:412px;flex:0 0 412px;padding:0 2px 16px}
    .top{padding:12px 22px;padding-top:calc(12px + env(safe-area-inset-top))}
    .brand b{font-size:var(--fs-title3)}
    .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);
      width:520px;max-height:78vh;border-radius:var(--r-sheet)}
    .sheet.on{animation:none}
    .compass-fab{width:66px;height:66px}
  }
  @media (hover:none) and (pointer:coarse){
    #zin,#zout{display:none}
  }
  @media (max-width:430px){
    .brand small{display:none}
    .brand b{font-size:var(--fs-callout)}
    .logo{width:28px;height:28px;border-radius:8px}
  }
  @media (max-width:360px){
    .brand small{display:none}
    .factgrid{grid-template-columns:repeat(2,1fr)}
  }
  @media (prefers-reduced-motion: reduce){
    .sheet.on,.findme.on{animation:none}
    .fm-ring::before{animation:none;opacity:0}
    .fm-arrow,.fm-dot,.compass-fab,.citybtn,.mapctl button{transition:none}
  }
  @media (prefers-contrast: more){
    :root{--sep:rgba(21,23,27,.28);--sep-strong:rgba(21,23,27,.45);--label-2:rgba(21,23,27,.8)}
    .card,.item,.badge{border-color:var(--sep-strong)}
  }
  @media (prefers-contrast: more) and (prefers-color-scheme: dark){
    :root{--sep:rgba(242,239,232,.3);--sep-strong:rgba(242,239,232,.48);--label-2:rgba(242,239,232,.82)}
  }
/* =====================================================================
   第二轮视觉升级：底部面板三段式、结果卡摘要、偏好分段控件
   ===================================================================== */

/* ---- 面板脚手架（桌面：普通滚动列；移动：可拖拽底部面板） ---- */
.panel-grab{display:none}
.panel-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 12px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.panel-scroll>*{flex:0 0 auto}

/* ---- 偏好分段控件 ---- */
.prefrow{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-top:.5px solid var(--sep)}
.prefrow>label{font-size:var(--fs-footnote);color:var(--label-2);font-weight:600}
.prefseg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  margin:0 -2px;padding:2px}
.prefseg::-webkit-scrollbar{display:none}
.prefseg button{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:10px;
  border:.5px solid var(--sep);background:var(--bg);color:var(--label-2);
  font-size:var(--fs-footnote);font-weight:600;white-space:nowrap;
  transition:background .15s ease,color .15s ease,border-color .15s ease,transform .12s ease}
.prefseg button:active{transform:scale(.97)}
.prefseg button.on{background:var(--ink);border-color:transparent;color:var(--on-ink)}
.prefseg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- 规划按钮加载态 ---- */
.planbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.planbtn[data-busy="1"]{opacity:.72;pointer-events:none}
.planbtn .spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.planbtn[data-busy="1"] .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- 结果摘要 ---- */
.rsum{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.rsum .dur{font-size:2rem;font-weight:750;letter-spacing:-1.2px;line-height:1.05;
  font-variant-numeric:tabular-nums}
.rsum .dur-sub{font-size:var(--fs-caption1);color:var(--label-2);margin-top:4px}
.rsum .stats{display:flex;gap:18px;text-align:right}
.rsum .stat b{display:block;font-size:var(--fs-title3);font-weight:700;letter-spacing:-.3px;
  font-variant-numeric:tabular-nums}
.rsum .stat span{font-size:var(--fs-caption2);color:var(--label-2)}
.rsum.bad .dur{color:var(--red)}

.rbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* 方案卡片 */
.ralts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -2px 0;padding:2px}
.ralts::-webkit-scrollbar{display:none}
.ralts button{flex:0 0 auto;min-width:108px;min-height:64px;border:.5px solid var(--sep);
  border-radius:12px;background:var(--bg);color:var(--label);padding:9px 12px;text-align:left;
  display:flex;flex-direction:column;gap:2px;transition:background .15s ease,border-color .15s ease,transform .12s ease}
.ralts button:active{transform:scale(.985)}
.ralts button .rt{display:flex;align-items:center;gap:6px;font-size:var(--fs-caption1);
  font-weight:650;color:var(--label-2)}
.ralts button .rv{font-size:var(--fs-headline);font-weight:750;letter-spacing:-.4px;
  font-variant-numeric:tabular-nums}
.ralts button .rf{font-size:var(--fs-caption2);color:var(--label-2)}
.ralts button.on{background:var(--ink);border-color:transparent;color:var(--on-ink)}
.ralts button.on .rt,.ralts button.on .rf{color:rgba(255,255,255,.72)}
@media (prefers-color-scheme: dark){ .ralts button.on .rt,.ralts button.on .rf{color:rgba(21,23,27,.62)} }
.rec{font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:2px 6px;border-radius:5px;
  background:rgba(10,102,216,.12);color:var(--blue)}
.ralts button.on .rec{background:rgba(255,255,255,.18);color:#fff}
@media (prefers-color-scheme: dark){ .ralts button.on .rec{background:rgba(21,23,27,.14);color:rgba(21,23,27,.8)} }

/* 分段：乘车 / 步行换乘 */
.legs{margin-top:14px;border-top:.5px solid var(--sep);padding-top:4px}
.leg{display:flex;gap:12px;padding:14px 0;border-bottom:.5px solid var(--sep)}
.leg:last-child{border-bottom:0}
.leg .rail{width:3px;border-radius:2px;flex:0 0 auto;margin-top:4px;background:var(--fill-2)}
.leg.ride .rail{background:currentColor}
.leg .body{flex:1;min-width:0}
.leg .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leg .dir{font-size:var(--fs-caption1);color:var(--label-2);font-weight:600}
.leg .pair{display:flex;align-items:flex-start;gap:10px;margin-top:8px}
.leg .pair .nodes{display:flex;flex-direction:column;gap:22px;padding-top:4px}
.leg .pair .node{width:8px;height:8px;border-radius:50%;background:var(--label);
  box-shadow:0 0 0 2px var(--bg-elevated)}
.leg .pair .node.empty{background:var(--bg-elevated);box-shadow:inset 0 0 0 2px var(--label-3)}
.leg .pair .stops{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.leg .pair .stops .nm{font-size:var(--fs-callout);font-weight:650;color:var(--label)}
.leg .pair .stops .mid{font-size:var(--fs-caption1);color:var(--label-2);padding:2px 0}
.leg .times{font-size:var(--fs-caption2);color:var(--label-3);margin-top:8px;
  font-variant-numeric:tabular-nums}
.leg.walk{padding:10px 0}
.leg.walk .rail{background:transparent;border-left:2px dotted var(--sep-strong)}
.leg.walk .whead{font-size:var(--fs-footnote);font-weight:650;color:var(--label);display:flex;
  align-items:center;gap:6px}
.leg.walk .whead .ico{font-size:var(--fs-caption1);color:var(--label-2)}
.leg.walk .wsub{font-size:var(--fs-caption1);color:var(--label-2);margin-top:3px}
.leg .est{font-size:var(--fs-caption2);color:var(--label-3);margin-left:4px}

/* ---- 移动端：地图书签式底部面板 ---- */
@media (max-width:979px){
  .layout{position:relative;padding:0;gap:0;overflow:hidden}
  .map-wrap{position:absolute;left:0;right:0;top:0;bottom:var(--panel-h,96px);height:auto;min-height:0;margin:0;
    border-radius:0;border:0;border-bottom:.5px solid var(--sep);box-shadow:none}
  .panel{position:absolute;left:0;right:0;bottom:0;height:calc(100% - 64px);
    padding:0;display:flex;flex-direction:column;
    background:var(--bg);border-radius:20px 20px 0 0;
    border-top:.5px solid var(--sep);
    box-shadow:0 -22px 48px -30px rgba(0,0,0,.55);
    transform:translateY(var(--panel-y, calc(100% - 96px)));
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    will-change:transform;touch-action:none}
  .panel.dragging{transition:none}
  .panel-grab{display:flex;justify-content:center;align-items:center;height:28px;flex:0 0 auto;
    cursor:grab;touch-action:none}
  .panel-grab::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--label-3);
    opacity:.6}
  .panel-scroll{overscroll-behavior:contain;padding-top:2px}
  .hint{bottom:38px}
  .osm-attr{bottom:10px;left:10px}
  .compass-fab{bottom:12px}
  .nearbtn{bottom:40px}
}
@media (max-width:979px) and (max-height:700px){
  .panel{height:calc(100% - 56px)}
}
@media (min-width:980px){
  .panel{overflow:visible}
  .panel-scroll{overflow:visible;padding:0 2px 16px}
}

</style>

<body>
<header class="top">
  <div class="brand">
    <div class="logo">M</div>
    <div><b>中国地铁 · 离线导航</b><small>China Metro Offline · 单文件运行</small></div>
  </div>
  <div class="top-actions">
    <button class="citybtn" id="cityBtn">上海 <span>▾</span></button>
    <button class="iconbtn" id="infoBtn" aria-label="数据说明">ⓘ</button>
  </div>
</header>

<main class="layout">
  <section class="map-wrap" id="mapWrap">
    <svg id="map" role="img" aria-label="城市地铁线路图"></svg>
    <div class="maptag" id="mapTag">上海地铁</div>
    <div class="mapctl">
      <button id="zin" aria-label="放大">＋</button>
      <button id="zout" aria-label="缩小">－</button>
      <button id="zfit" aria-label="复位">⤢</button>
      <button id="tileBtn" class="on" aria-label="显示或隐藏离线底图">图</button>
      <button id="locBtn" aria-label="显示我的位置">◎</button>
    </div>
    <div class="osm-attr" id="osmAttr">© OpenStreetMap contributors · 离线底图</div>
    <button class="nearbtn" id="nearBtn" hidden></button>
    <div class="hint" id="hint">轻点地图车站选择起点</div>
    <button class="compass-fab" id="compassFab" hidden aria-label="指向起点">
      <span class="arw" id="fabArrow"><svg viewBox="0 0 100 100" width="22" height="22" aria-hidden="true"><path d="M50 4 L86 96 L50 76 L14 96 Z" fill="currentColor"/></svg></span>
      <span class="dst" id="fabDist">定位</span>
    </button>
    <div class="hoverTip" id="hoverTip"></div>
  </section>

  <aside class="panel" id="panel">
    <div class="panel-grab" id="panelGrab" role="button" tabindex="0" aria-label="展开或收起路线面板"></div>
    <div class="panel-scroll" id="panelScroll">
    <section class="card trip">
      <div class="trow">
        <span class="dot from">起</span>
        <button class="field" id="fromBtn"><i>起点</i><b class="empty">选择起点站</b></button>
      </div>
      <div class="trow">
        <span class="dot to">终</span>
        <button class="field" id="toBtn"><i>终点</i><b class="empty">选择终点站</b></button>
        <button class="swap" id="swapBtn" aria-label="交换起终点">⇅</button>
      </div>
      <div class="trow">
        <span class="dot time">时</span>
        <div class="field"><i>出发时间</i>
          <div class="time-edit"><input type="datetime-local" id="depInput"><button class="pickbtn" id="timePickBtn">选择</button><button class="nowbtn" id="nowBtn">现在</button></div>
        </div>
      </div>
      <div class="prefrow">
        <label id="prefLabel">路线偏好</label>
        <div class="prefseg" id="prefSeg" role="group" aria-labelledby="prefLabel">
          <button type="button" data-pref="fast" class="on">最快</button>
          <button type="button" data-pref="few">少换乘</button>
          <button type="button" data-pref="stops">少站</button>
          <button type="button" data-pref="walk">少步行</button>
          <button type="button" data-pref="fare">最低价</button>
          <button type="button" data-pref="balanced">综合</button>
        </div>
        <select id="pref" hidden aria-hidden="true" tabindex="-1">
          <option value="fast">最快到达</option>
          <option value="few">最少换乘</option>
          <option value="stops">最少站数</option>
          <option value="walk">最少步行</option>
          <option value="fare">最低票价</option>
          <option value="balanced">综合推荐</option>
        </select>
      </div>
      <button class="planbtn" id="planBtn"><span class="spin" aria-hidden="true"></span><span id="planLabel">规划路线</span></button>
    </section>

    <section class="card result" id="result"></section>

    <section class="card facts" id="cityFacts"></section>

    <div class="datafoot" id="footer">数据加载中…</div>
    </div>
  </aside>
</main>

<div class="mask" id="mask"></div>

<div class="sheet" id="citySheet" role="dialog" aria-modal="true" aria-labelledby="citySheetTitle">
  <div class="sheet-grab"></div>
  <div class="sheet-titlebar"><h2 id="citySheetTitle">选择城市</h2><button class="textbtn" data-close>取消</button></div>
  <div class="sheet-head"><input id="cityQ" type="search" placeholder="搜索城市 / 拼音 / 英文" autocomplete="off" aria-label="搜索城市"></div>
  <div class="list" id="cityList"></div>
</div>

<div class="sheet" id="stationSheet" role="dialog" aria-modal="true" aria-labelledby="stationTitle">
  <div class="sheet-grab"></div>

  var sym = currency === "HKD" ? "HK$" : currency === "MOP" ? "MOP$" : "¥";
  return sym + (Number.isInteger(v) ? v : v.toFixed(1));
}
function dateInputValue(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function parseDateInput(v){
  if (!v) return null;
  var p = v.split(/[-T:]/).map(Number);
  if (p.length < 5 || p.some(isNaN)) return null;
  return new Date(p[0], p[1]-1, p[2], p[3], p[4], 0, 0);
}
function syncTimeControls(){
  var inp=document.getElementById("depInput");
  if(inp) inp.value=dateInputValue(state.dep);
}
var picker={date:null,hour:0,minute:0};
function openTimePicker(){
  picker.date=new Date(state.dep.getFullYear(),state.dep.getMonth(),state.dep.getDate());
  picker.hour=state.dep.getHours(); picker.minute=state.dep.getMinutes();
  openSheet("timeSheet");
  renderTimePicker();
}
function renderTimePicker(){
  var dt=document.getElementById("tpDate"), prev=document.getElementById("tpPreview");
  if(dt) dt.value=picker.date.getFullYear()+"-"+pad(picker.date.getMonth()+1)+"-"+pad(picker.date.getDate());
  if(prev) prev.textContent=picker.date.getFullYear()+"/"+pad(picker.date.getMonth()+1)+"/"+pad(picker.date.getDate())+" "+pad(picker.hour)+":"+pad(picker.minute);
  var hh=document.getElementById("tpHours"), mm=document.getElementById("tpMinutes");
  if(hh){
    var html="";
    for(var h=0;h<24;h++) html+='<button data-h="'+h+'" class="'+(h===picker.hour?"on":"")+'">'+pad(h)+'</button>';
    hh.innerHTML=html;
    var hs=hh.querySelectorAll("[data-h]");
    for(var i=0;i<hs.length;i++) hs[i].onclick=function(){ picker.hour=Number(this.getAttribute("data-h")); renderTimePicker(); };
  }

    for(var m=0;m<60;m+=5) mhtml+='<button data-m="'+m+'" class="'+(m===picker.minute?"on":"")+'">'+pad(m)+'</button>';
    mm.innerHTML=mhtml;
    var ms=mm.querySelectorAll("[data-m]");
    for(var j=0;j<ms.length;j++) ms[j].onclick=function(){ picker.minute=Number(this.getAttribute("data-m")); renderTimePicker(); };
  }
}

  syncTimeControls();

function dayIndex(d){ return (d.getDay() + 6) % 7; }
function lineName(c, li){ return (c.raw.lines[li] || ["?"])[0]; }
function lineColor(c, li){ return (c.raw.lines[li] || [null,null,"#888"])[2] || "#888"; }
function isLight(hex){
  var h = String(hex || "#888").replace("#","");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h,16); if (isNaN(n)) return false;
  var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (r*299+g*587+b*114)/1000 > 176;
}
function modeName(c, li){
  var m=(c.raw.lines[li]||[])[4]||"metro";
  return {metro:"地铁",suburban_rail:"市域铁路",light_rail:"轻轨",monorail:"单轨",tram:"有轨电车"}[m]||m;
}
function lineChip(c, li){
  var col = lineColor(c,li);
  var title=lineName(c,li)+" · "+modeName(c,li);
  return '<span class="lc' + (isLight(col) ? " dark" : "") + '" title="'+esc(title)+'" style="background:' + col + '">' + esc(lineName(c,li)) + '</span>';
}
function stationName(c, si){ return (c.raw.stations[si] || ["?"])[0]; }
function stationEn(c, si){ return (c.raw.stations[si] || ["",""])[1] || ""; }

/* ---------------- city runtime ---------------- */
function getCity(id){
  if (runtimeCache.has(id)) return runtimeCache.get(id);
  var raw = byId.get(id);
  if (!raw) return null;
  var c = { raw: raw, id: id };
  var nSt = raw.stations.length, nStop = raw.stops.length, nLine = raw.lines.length;
  c.stopStation = new Int32Array(nStop);
  c.stopLine = new Int32Array(nStop);
  c.stationStops = new Array(nSt);
  c.stationLines = new Array(nSt);
  for (var i=0;i<nSt;i++){ c.stationStops[i]=[]; c.stationLines[i]=[]; }
  for (var s=0;s<nStop;s++){
    var st=raw.stops[s][0], li=raw.stops[s][1];
    c.stopStation[s]=st; c.stopLine[s]=li;
    c.stationStops[st].push(s);
    if (c.stationLines[st].indexOf(li) < 0) c.stationLines[st].push(li);
  }
  c.linePatterns = new Array(nLine);
  for (var l=0;l<nLine;l++) c.linePatterns[l]=[];
  for (var p=0;p<raw.patterns.length;p++){
    var pat=raw.patterns[p];
    if (c.linePatterns[pat[0]]) c.linePatterns[pat[0]].push(pat);
  }
  c.lineAdj = new Array(nLine);
  for (var la=0;la<nLine;la++) c.lineAdj[la]=new Map();
  for (var sg=0; sg<raw.segments.length; sg++){
    var sa=raw.segments[sg][0], sb=raw.segments[sg][1], sl=c.stopLine[sa];
    if(!c.lineAdj[sl].has(sa)) c.lineAdj[sl].set(sa,[]);
    if(!c.lineAdj[sl].has(sb)) c.lineAdj[sl].set(sb,[]);
    c.lineAdj[sl].get(sa).push(sb); c.lineAdj[sl].get(sb).push(sa);
  }
  c.ttByStop = new Map();
  for (var t=0;t<raw.timetables.length;t++){
    var rec=raw.timetables[t], list=c.ttByStop.get(rec[0]);
    if (!list){ list=[]; c.ttByStop.set(rec[0],list); }
    list.push(rec);
  }
  c.farePos = new Int32Array(nSt); c.farePos.fill(-1);
  for (var f=0; f<raw.fareOrder.length; f++) c.farePos[raw.fareOrder[f]] = f;
  c.adj = null;
  c.proj = null;
  c.baseK = 1;
  c.search = [];
  for (var i2=0;i2<nSt;i2++){
    var lines = c.stationLines[i2].map(function(x){ return lineName(c,x); });
    c.search.push({ s:i2, n:stationName(c,i2).toLowerCase(), e:stationEn(c,i2).toLowerCase(), lines:lines });
  }
  runtimeCache.set(id,c);
  return c;
}

/* ---------------- graph + routing ---------------- */
function ensureAdj(c){
  if (c.adj) return c.adj;
  var adj = new Array(c.raw.stops.length);
  for (var i=0;i<adj.length;i++) adj[i]=[];
  var segs=c.raw.segments;
  for (var s=0;s<segs.length;s++){
    var a=segs[s][0], b=segs[s][1], sec=segs[s][2], km=segs[s][3];
    adj[a].push({to:b, sec:sec, km:km, kind:"ride", line:c.stopLine[a]});
    adj[b].push({to:a, sec:sec, km:km, kind:"ride", line:c.stopLine[b]});
  }
  var xf=c.raw.transfers;
  for (var x=0;x<xf.length;x++){
    var u=xf[x][0], v=xf[x][1], w=xf[x][2], oos=xf[x][3];
    adj[u].push({to:v, sec:w, km:0, kind:"transfer", oos:!!oos});
  }
  c.adj=adj;
  return adj;
}
function Heap(){
  this.a=[];
}
Heap.prototype.push=function(p,v){
  var a=this.a; a.push([p,v]); var i=a.length-1;
  while(i>0){ var par=(i-1)>>1; if(a[par][0]<=a[i][0]) break; var t=a[par]; a[par]=a[i]; a[i]=t; i=par; }
};
Heap.prototype.pop=function(){
  var a=this.a; if(!a.length) return null;
  var top=a[0], last=a.pop();
  if(a.length){ a[0]=last; var i=0; for(;;){ var l=i*2+1,r=l+1,m=i; if(l<a.length&&a[l][0]<a[m][0])m=l; if(r<a.length&&a[r][0]<a[m][0])m=r; if(m===i)break; var t=a[m];a[m]=a[i];a[i]=t;i=m; } }
  return top;
};
Heap.prototype.size=function(){ return this.a.length; };

function edgeCost(e, mode){
  if (mode === "few") return (e.kind === "transfer" ? 1e7 : 0) + e.sec;
  if (mode === "stops") return (e.kind === "ride" ? 1e7 : 0) + e.sec;
  if (mode === "walk") return e.kind === "transfer" ? e.sec * 1e4 + 1 : e.sec;
  if (mode === "balanced") return e.sec + (e.kind === "transfer" ? 150 : 0);
  return e.sec + (e.kind === "transfer" ? 90 : 0);
}
function dijkstra(c, fromSt, toSt, mode){
  var adj=ensureAdj(c);
  var sources=c.stationStops[fromSt], targets=new Set(c.stationStops[toSt]);
  if (!sources.length || !targets.size) return null;
  var dist=new Map(), prev=new Map(), heap=new Heap();
  for (var i=0;i<sources.length;i++){ dist.set(sources[i],0); heap.push(0,sources[i]); }
  var end=null;
  while(heap.size()){
    var top=heap.pop(); var d=top[0], u=top[1];
    if (d > (dist.get(u)==null ? Infinity : dist.get(u))) continue;
    if (targets.has(u)){ end=u; break; }
    var es=adj[u];
    for (var k=0;k<es.length;k++){
      var e=es[k], nd=d+edgeCost(e,mode);
      var cur=dist.get(e.to)==null?Infinity:dist.get(e.to);
      if (nd < cur-1e-9){ dist.set(e.to,nd); prev.set(e.to,{from:u,edge:e}); heap.push(nd,e.to); }
    }
  }
  if (end==null) return null;
  var chain=[]; var cur=end;
  while(cur!=null){ chain.push(cur); var p=prev.get(cur); cur=p?p.from:null; }
  chain.reverse();
  return { path:chain, cost:dist.get(end) };
}

function buildLegs(c, path){
  var legs=[];
  var cur=null;
  for (var i=1;i<path.length;i++){
    var a=path[i-1], b=path[i];
    var edge=null;
    var es=ensureAdj(c)[a];
    for (var k=0;k<es.length;k++){ if(es[k].to===b){ if(!edge||es[k].sec<edge.sec) edge=es[k]; } }
    if (!edge) continue;
    if (edge.kind === "ride"){
      if (cur && cur.kind === "ride" && cur.line === edge.line){
        cur.stations.push(b); cur.sec += edge.sec; cur.km += (edge.km||0); cur.edgeSec.push(edge.sec); cur.edgeKm.push(edge.km||0);
      } else {
        cur = {kind:"ride", line:edge.line, stations:[a,b], sec:edge.sec, km:(edge.km||0), edgeSec:[edge.sec], edgeKm:[edge.km||0]};
        legs.push(cur);
      }
    } else {
      cur = null;
      legs.push({kind:"transfer", from:a, to:b, sec:edge.sec, km:0, oos:!!edge.oos});
    }
  }
  return splitBranches(c, legs);
}

function coverLength(pattern, seq, start){
  var best=0;
  for (var i=0;i<pattern.length;i++){
    if (pattern[i] !== seq[start]) continue;
    for (var dir=-1;dir<=1;dir+=2){
      var j=i, k=start;
      while (k<seq.length && j>=0 && j<pattern.length && pattern[j]===seq[k]){ j+=dir;k++; }
      if (k-start>best) best=k-start;
    }
  }
  return best;
}
function splitBranches(c, legs){
  var out=[];
  for (var li=0; li<legs.length; li++){
    var leg=legs[li];
    if (leg.kind !== "ride"){ out.push(leg); continue; }
    var pats=c.linePatterns[leg.line] || [];
    if (!pats.length || leg.stations.length < 3){ out.push(leg); continue; }
    // If a published service from the boarding stop actually reaches the alight stop,
    // it is a through train even when no single pattern contains both branches.
    var lastStop=leg.stations[leg.stations.length-1], through=false;
    var recs0=c.ttByStop.get(leg.stations[0]) || [];
    for (var ri=0;ri<recs0.length;ri++){
      if (stopAhead(c,leg.line,leg.stations[0],lastStop,recs0[ri][1])){ through=true; break; }
    }
    if (through){ out.push(leg); continue; }
    var seq=leg.stations, i=0, guard=0;
    while(i<seq.length-1 && guard++<20){
      var best=0;
      for (var p=0;p<pats.length;p++){
        var cov=coverLength(pats[p][1],seq,i);
        if (cov>best) best=cov;
      }
      if (best>=seq.length-i || best<2){
        var sub={kind:"ride",line:leg.line,stations:seq.slice(i),sec:0,km:0,edgeSec:[],edgeKm:[]};
        for (var q=i;q<seq.length-1;q++){ sub.sec += leg.edgeSec[q]; sub.km += leg.edgeKm[q]; sub.edgeSec.push(leg.edgeSec[q]); sub.edgeKm.push(leg.edgeKm[q]); }
        out.push(sub); break;
      }
      var end=i+best-1;
      var s1={kind:"ride",line:leg.line,stations:seq.slice(i,end+1),sec:0,km:0,edgeSec:[],edgeKm:[]};
      for (var q2=i;q2<end;q2++){ s1.sec += leg.edgeSec[q2]; s1.km += leg.edgeKm[q2]; s1.edgeSec.push(leg.edgeSec[q2]); s1.edgeKm.push(leg.edgeKm[q2]); }
      out.push(s1);
      out.push({kind:"transfer",from:seq[end],to:seq[end],sec:120,km:0,sameLine:true});
      i=end;
    }
  }
  return out;
}

function stopAhead(c, line, fromStop, toStop, destStop){
  if (!destStop || destStop===fromStop) return false;
  if (destStop===toStop) return true;
  // Does a train from `fromStop` to `destStop` pass through `toStop`?
  // BFS on the line's physical stop graph (works across branch junctions and loops).
  var adj=c.lineAdj[line]; if(!adj) return false;
  var q=[fromStop], prev=new Map(); prev.set(fromStop,null); var found=false;
  while(q.length){
    var u=q.shift(); if(u===destStop){found=true;break;}
    var ns=adj.get(u)||[];
    for(var i=0;i<ns.length;i++){ var v=ns[i]; if(!prev.has(v)){ prev.set(v,u); q.push(v); } }
  }
  if(!found) return false;
  var cur=destStop, seen=false;
  while(cur!=null){ if(cur===toStop){seen=true;break;} cur=prev.get(cur); }
  return seen;
}
function decodeTime(str, day){
  if (!str) return null;
  var s=str.substr(day*3,3);
  if (!s || s==="---") return null;
  var n=0;
  for (var i=0;i<s.length;i++){ var ch=s[i]; var v="0123456789abcdefghijklmnopqrstuvwxyz".indexOf(ch); if(v<0) return null; n=n*36+v; }
  return n;
}
function bestWindow(c, line, fromStop, toStop, d){
  var recs=c.ttByStop.get(fromStop) || [];
  var valid=[];
  for (var i=0;i<recs.length;i++){
    var r=recs[i], destStop=r[1];
    if (stopAhead(c,line,fromStop,toStop,destStop)) valid.push(r);
  }
  if (!valid.length){
    // loop or incomplete data: use any record, but only if no destination filter possible
    var lineObj=c.raw.lines[line];
    if (lineObj && lineObj[5]) valid=recs;
  }
  if (!valid.length) return null;
  var di=dayIndex(d), first=null, last=null, best=null;
  for (var j=0;j<valid.length;j++){
    var rr=valid[j];
    var f=decodeTime(rr[2],di), l=decodeTime(rr[3],di);
    if (f!=null && (first==null || f<first)) first=f;
    if (l!=null && (last==null || l>last)){ last=l; best=rr; }
  }
  if (first==null && last==null) return null;
  return {first:first,last:last,destStop:best?best[1]:null,destName:best?stationName(c,c.stopStation[best[1]]):null};
}
function legRideMinutes(leg){ return leg.sec/60; }

function annotate(c, legs){
  for (var i=0;i<legs.length;i++){
    var leg=legs[i];
    if (leg.kind !== "ride") continue;
    var from=leg.stations[0], to=leg.stations[leg.stations.length-1];
    leg.from=from; leg.to=to;
    leg.window=bestWindow(c,leg.line,from,to,state.dep);
    leg.ride=legRideMinutes(leg);
  }
  return legs;
}

function planJourney(c, legs, d){
  var depMin=d.getHours()*60+d.getMinutes();
  var t=depMin, waits=0, walks=0, slack=Infinity, infeasible=null, out=[];
  for (var i=0;i<legs.length;i++){
    var leg=legs[i];
    if (leg.kind === "transfer"){
      if (!leg.sameLine) walks += leg.sec/60;
      else walks += 0;
      t += leg.sec/60;
      out.push({leg:leg, walk:leg.sec/60});
      continue;
    }
    var ride=leg.ride, w=leg.window;
    var board, wait;
    if (w && w.last != null){
      if (t > w.last + 0.001){ infeasible={leg:leg, reason:"last", last:w.last, from:leg.from}; break; }
      if (w.first != null && t < w.first) board=w.first;
      else board=Math.min(t+3, w.last);
      if (board > w.last + 0.001){ infeasible={leg:leg, reason:"last", last:w.last, from:leg.from}; break; }
      wait=board-t;
      slack=Math.min(slack,w.last-board);
    } else {
      board=t+3; wait=3;
    }
    waits += wait;
    t=board+ride;
    out.push({leg:leg, board:board, arrive:t, wait:wait, ride:ride, window:w});
  }
  if (infeasible) return {ok:false, infeasible:infeasible, parts:out, dep:depMin, waits:waits, walks:walks};
  return {ok:true, parts:out, arrive:t, total:t-depMin, dep:depMin, waits:waits, walks:walks,
    latest: (isFinite(slack) ? Math.max(depMin, depMin+slack-1) : null)};
}

function fareFor(c, fromSt, toSt){
  if (fromSt === toSt) return {value:0, official:true};
  var a=c.farePos[fromSt], b=c.farePos[toSt];
  if (a<0 || b<0) return null;
  var row=c.raw.fares[a]; if (!row) return null;
  var ch=row[b]; if (!ch || ch===".") return null;
  var v="0123456789abcdefghijklmnopqrstuvwxyz".indexOf(ch);
  return v<0 ? null : {value:v, official:true};
}

function routeSignature(legs){
  return legs.map(function(l){ return l.kind==="ride" ? "R"+l.line+":"+l.stations[0]+"-"+l.stations[l.stations.length-1] : "T"+l.from; }).join("|");
}
function computeRoutes(c, fromSt, toSt, d){
  var modes=[["fast","最快"],["few","少换乘"],["stops","少站"],["walk","少步行"]];
  var found=[], seen=new Set();
  for (var i=0;i<modes.length;i++){
    var r=dijkstra(c,fromSt,toSt,modes[i][0]);
    if (!r) continue;
    var legs=annotate(c, buildLegs(c,r.path));
    var plan=planJourney(c,legs,d);
    var fare=fareFor(c,fromSt,toSt);
    var sig=routeSignature(legs);
    if (seen.has(sig)) continue;
    seen.add(sig);
    found.push({mode:modes[i][0], label:modes[i][1], legs:legs, plan:plan, fare:fare,
      sig:sig, cost:r.cost});
  }
  return found;
}

/* ---------------- map ---------------- */
function projectCity(c){
  if (c.proj) return c.proj;
  var n=c.raw.stations.length, xs=new Float64Array(n), ys=new Float64Array(n);
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for (var i=0;i<n;i++){
    var lon=c.raw.stations[i][2], lat=c.raw.stations[i][3];
    var x=(lon+180)/360;
    var y=(1-Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360))/Math.PI)/2;
    xs[i]=x; ys[i]=y;
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  var w=Math.max(maxX-minX,1e-9), h=Math.max(maxY-minY,1e-9), s=1/Math.max(w,h);
  var ox=0.08+(1-(w*s))*0.5, oy=0.08+(1-(h*s))*0.5;
  var px=new Float64Array(n), py=new Float64Array(n);
  for (var j=0;j<n;j++){ px[j]=ox+(xs[j]-minX)*s; py[j]=oy+(ys[j]-minY)*s; }
  c.proj={px:px,py:py,minX:minX,minY:minY,s:s,ox:ox,oy:oy};
  return c.proj;
}
function addTiles(c,proj,g){
  var hasMosaic=!!c.raw.tileMosaic, hasTiles=!!(c.raw.tiles&&c.raw.tiles.length);
  if(!hasMosaic && !hasTiles) return;
  var n=Math.pow(2,c.raw.tileZ||10), ts=1/n;
  if(hasMosaic){
    var m=c.raw.tileMosaic, mw=m[3]/256*ts, mh=m[4]/256*ts;
    var img=document.createElementNS("http://www.w3.org/2000/svg","image");
    img.setAttribute("x",String(proj.ox+(m[1]*ts-proj.minX)*proj.s));
    img.setAttribute("y",String(proj.oy+(m[2]*ts-proj.minY)*proj.s));
    img.setAttribute("width",String(mw*proj.s));
    img.setAttribute("height",String(mh*proj.s));
    img.setAttribute("preserveAspectRatio","none");
    var murl="data:"+(c.raw.tileMime||"image/jpeg")+";base64,"+m[5];
    img.setAttribute("href",murl);
    img.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href",murl);
    g.appendChild(img); return;
  }
  for(var i=0;i<c.raw.tiles.length;i++){
    var t=c.raw.tiles[i];
    var img=document.createElementNS("http://www.w3.org/2000/svg","image");
    var pad=ts*proj.s*0.003;
    img.setAttribute("x",String(proj.ox+(t[0]*ts-proj.minX)*proj.s-pad));
    img.setAttribute("y",String(proj.oy+(t[1]*ts-proj.minY)*proj.s-pad));
    img.setAttribute("width",String(ts*proj.s+pad*2));
    img.setAttribute("height",String(ts*proj.s+pad*2));
    img.setAttribute("preserveAspectRatio","none");
    var url="data:"+(c.raw.tileMime||"image/png")+";base64,"+t[2];
    img.setAttribute("href",url);
    img.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href",url);
    g.appendChild(img);
  }
}
function buildMap(c){
  var proj=projectCity(c);
  var svg=$("map");
  var token=++mapBuildToken;
  var world=document.createElementNS("http://www.w3.org/2000/svg","g");
  world.setAttribute("id","world");

  var firstWin=firstRidePart?firstRidePart.leg.window:null;
  var beforeFirst=!!(p.ok && firstWin && firstWin.first!=null && p.dep < firstWin.first);

      var nextLine='';
      if (li+1<r.legs.length && r.legs[li+1].kind==='ride') nextLine=lineName(c,r.legs[li+1].line);
      var walkMin=Math.max(1,Math.round(leg.sec/60));
      legsHtml+='<div class="leg walk"><div class="rail"></div><div class="body">'+
        '<div class="whead">'+(leg.sameLine?'同站换向':'步行换乘')+
          '<span class="est">'+(leg.sameLine?'等待下一班':'约 '+walkMin+' 分钟 · 估算')+'</span></div>'+
        '<div class="wsub">在 '+esc(tst)+(leg.sameLine?' 换乘同线反方向列车':' 换乘 '+esc(nextLine))+'</div>'+
        '</div></div>';
      continue;
    }
    var board=null;
    if (p.ok){
      for (var pi=0;pi<p.parts.length;pi++){ if(p.parts[pi].leg===leg){ board=p.parts[pi].board; break; } }
    }
    var dest=leg.window&&leg.window.destName?'往 '+esc(leg.window.destName):'';
    var first=leg.window&&leg.window.first!=null?fmtMin(leg.window.first):"—";
    var last=leg.window&&leg.window.last!=null?fmtMin(leg.window.last):"—";
    var fromName=esc(stationName(c,c.stopStation[leg.stations[0]]));
    var toName=esc(stationName(c,c.stopStation[leg.stations[leg.stations.length-1]]));
    var nStops=leg.stations.length-1;
    legsHtml+='<div class="leg ride"><div class="rail" style="background:'+lineColor(c,leg.line)+'"></div><div class="body">'+
      '<div class="head">'+lineChip(c,leg.line)+(dest?'<span class="dir">'+dest+'</span>':'')+'</div>'+
      '<div class="pair"><div class="nodes"><span class="node"></span><span class="node empty"></span></div>'+
        '<div class="stops">'+
          '<div class="nm">'+fromName+'</div>'+

          '<div class="nm">'+toName+'</div>'+

      '<details class="stopsbox"><summary>逐站查看</summary><ol>';
    for (var sj=0;sj<leg.stations.length;sj++) legsHtml+='<li>'+esc(stationName(c,c.stopStation[leg.stations[sj]]))+'</li>';
    legsHtml+='</ol></details></div></div>';
  }
  legsHtml+='</div>';
  var notes='';
  if(p.ok && p.latest!=null) notes+='<div class="note">最晚约 '+fmtMin(p.latest)+' 从起点出发可赶上全程末班车；候车按 3 分钟估算。</div>';
  if(beforeFirst) notes+='<div class="note">当前早于首班车 '+fmtMin(firstWin.first)+'，需在站外/站厅等候约 '+fmtDuration(firstWin.first-p.dep)+'；实际首班时刻以车站公告为准。</div>';
  notes+='<div class="note">票价来自该城市官方 OD 票价表；首末班来自内置时刻数据，乘车/换乘时间为估算值，实际以车站公告为准。</div>';
  el.innerHTML=sumHtml+badgeHtml+altHtml+warn+legsHtml+notes;
  var bs=el.querySelectorAll('[data-alt]');
  for (var b=0;b<bs.length;b++) bs[b].onclick=function(){ state.sel=Number(this.getAttribute("data-alt")); renderResult(); drawRoute(); };

  // pointer drag/zoom
  var pointers=new Map(), drag=null, start=null, moved=0, pinch=null;

  svg.addEventListener("pointerdown",function(e){
    svg.setPointerCapture(e.pointerId);
    var p=localPt(e); pointers.set(e.pointerId,p);
    if(pointers.size===1){ drag=true; moved=0; start=p; svg.classList.add("grabbing"); }
    else if(pointers.size===2){
      var a=Array.from(pointers.values()); pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),k:view.k,x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,vx:view.x,vy:view.y}; drag=false;
    }
  });
  svg.addEventListener("pointermove",function(e){
    var p=localPt(e);
    if(pointers.has(e.pointerId)){
      var prev=pointers.get(e.pointerId); pointers.set(e.pointerId,p);
      if(pointers.size===2 && pinch){
        var a=Array.from(pointers.values()); var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
        var mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
        var k=Math.max(view.baseK*0.55,Math.min(view.baseK*8,pinch.k*d/(pinch.d||1)));
        var wx=(pinch.x-pinch.vx)/pinch.k, wy=(pinch.y-pinch.vy)/pinch.k;
        view.k=k; view.x=mid.x-wx*k; view.y=mid.y-wy*k; applyView(); return;
      }
      if(drag){
        var dx=p.x-prev.x, dy=p.y-prev.y; moved+=Math.abs(dx)+Math.abs(dy);
        view.x+=dx; view.y+=dy; clampTileView(state.city, Math.max(32,0.16*Math.max(view.W,view.H))); setTransformOnly();
      }
    } else {
      var s=nearestStation(p.x,p.y), tip=$("hoverTip");
      if(s==null){ tip.style.display="none"; }
      else { tip.textContent=stationName(state.city,s)+" · "+state.city.stationLines[s].map(function(l){return lineName(state.city,l);}).join(" / "); tip.style.display="block"; tip.style.left=(p.x+12)+"px"; tip.style.top=(p.y-10)+"px"; }
    }
  });
  function endPointer(e){
    var p=pointers.get(e.pointerId); pointers.delete(e.pointerId);
    if(pointers.size<2) pinch=null;
    if(pointers.size===0){
      svg.classList.remove("grabbing");
      if(drag && moved<9 && p){
        var s=nearestStation(p.x,p.y);
        if(s!=null){
          if(state.from==null || (state.from!=null&&state.to!=null)) selectStation("from",s);
          else selectStation("to",s);
        }
      }
      drag=false;
      if (state.city) applyView();   // 松手回弹到边界内，避免留下空白边
    }
  }
  svg.addEventListener("pointerup",endPointer);
  svg.addEventListener("pointercancel",function(e){ pointers.delete(e.pointerId); pinch=null; drag=false; svg.classList.remove("grabbing"); });
  svg.addEventListener("pointerleave",function(){ $("hoverTip").style.display="none"; });
  $("mapWrap").addEventListener("wheel",function(e){ e.preventDefault(); var p=localPt(e); zoomAt(p.x,p.y,Math.exp(-e.deltaY*0.0016)); },{passive:false});
  window.addEventListener("resize",function(){ if(state.city){ view.W=$("mapWrap").clientWidth||360; view.H=$("mapWrap").clientHeight||300; fitView(); } });
}

var SVGNS = "http://www.w3.org/2000/svg";
var geoState = { on: false, watchId: null, pos: null, err: null, denied: false, starting: false };
var headState = { deg: 0, raw: 0, hasRaw: false, abs: false, started: false, available: false };
var fmRAF = 0, fabRAF = 0;
var rotState = { shown: 0, init: false, applied: null };
var fmLastFocus = null;

function shortestDelta(from, to){ return ((to - from + 540) % 360) - 180; }
/* CSS 的 rotate() 是数值插值：359°→1° 会倒着转一整圈。
   这里把角度展开成连续值，只走最短弧，罗盘转到正北时就不会再快速反转一圈。 */
function setArrowAngle(rel){
  rel = ((rel % 360) + 360) % 360;
  if (!rotState.init){ rotState.shown = rel; rotState.init = true; }
  else rotState.shown += shortestDelta(rotState.shown, rel);
  var t = "rotate(" + rotState.shown.toFixed(2) + "deg)";
  if (rotState.applied !== t){
    rotState.applied = t;
    var a = document.getElementById("fabArrow"); if (a) a.style.transform = t;
    var b = document.getElementById("fmArrow"); if (b) b.style.transform = t;
    var d = document.getElementById("fmDot"); if (d) d.style.transform = t;
  }
}

/* 城市标志色：取该城出现次数最多的线路颜色，配白色两字徽标 */
function cityRawColor(raw){
  var lines = (raw && raw.lines) || [], counts = {}, best = null, bn = 0;
  for (var i=0;i<lines.length;i++){
    var col = (lines[i]||[])[2];
    if (!col || col.charAt(0)!="#") continue;
    counts[col] = (counts[col]||0) + 1;
    if (counts[col] > bn){ bn = counts[col]; best = col; }
  }
  return best || "#5b6068";
}
function cityMarkHTML(raw, cls){
  var id = raw && raw.id;
  var logo = id && CITY_LOGOS[id];
  if (logo) return '<span class="citymark logo '+(cls||'')+'"><img src="'+logo+'" alt="" decoding="async"></span>';
  var nm = (raw && raw.name) || "";
  var t = nm.length <= 2 ? nm : nm.slice(0,2);
  return '<span class="citymark '+(cls||'')+'" style="background:'+cityRawColor(raw)+'">'+esc(t)+'</span>';
}

function mercYof(lat){ return (1-Math.log(Math.tan(Math.PI/4+lat*Math.PI/360))/Math.PI)/2; }
function geoToWorld(c, lon, lat){
  var p = projectCity(c);
  return [p.ox+((lon+180)/360-p.minX)*p.s, p.oy+(mercYof(lat)-p.minY)*p.s];
}
function distM(lat1, lon1, lat2, lon2){
  var R=6371000, p1=lat1*Math.PI/180, p2=lat2*Math.PI/180;
  var dp=(lat2-lat1)*Math.PI/180, dl=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
function bearingDeg(lat1, lon1, lat2, lon2){
  var p1=lat1*Math.PI/180, p2=lat2*Math.PI/180, dl=(lon2-lon1)*Math.PI/180;
  var y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function fmtDist(m){
  if (!isFinite(m)) return "—";
  if (m < 1000) return (Math.round(m/10)*10)+" 米";
  return (m/1000).toFixed(m<10000?1:0)+" 公里";
}
function relWord(rel){
  var a=((rel%360)+360)%360, x=a>180?360-a:a;
  if (x<15) return "正前方";
  if (x<50) return a>180?"左前方":"右前方";
  if (x<130) return a>180?"左侧":"右侧";
  if (x<165) return a>180?"左后方":"右后方";
  return "正后方";
}
function headingNow(){ return headState.available && headState.abs ? headState.deg : 0; }

function meLayer(){
  if (!mapLayers || !mapLayers.vectorWorld) return null;
  var g = document.getElementById("gMe");
  if (!g){ g = document.createElementNS(SVGNS,"g"); g.setAttribute("id","gMe"); mapLayers.vectorWorld.appendChild(g); }
  return g;
}
function renderMe(){
  if (!mapLayers || !state.city) return;
  var g = meLayer(); if (!g) return;
  g.innerHTML="";
  if (!geoState.pos) return;
  var c=state.city, w=geoToWorld(c, geoState.pos.lon, geoState.pos.lat), k=view.k||1;
  var s=projectCity(c).s;
  var worldPerMeter = s/(111320*Math.max(0.05,Math.cos(geoState.pos.lat*Math.PI/180))*360);
  var accR = geoState.pos.acc*worldPerMeter;
  if (isFinite(accR) && accR>0 && accR<3){
    var ac=document.createElementNS(SVGNS,"circle");
    ac.setAttribute("cx",w[0]); ac.setAttribute("cy",w[1]); ac.setAttribute("r",String(accR));
    ac.setAttribute("fill","rgba(29,78,216,.14)"); ac.setAttribute("stroke","rgba(29,78,216,.32)");
    ac.setAttribute("stroke-width",String(1/k));
    g.appendChild(ac);
  }
  var halo=document.createElementNS(SVGNS,"circle");
  halo.setAttribute("cx",w[0]); halo.setAttribute("cy",w[1]); halo.setAttribute("r",String(11/k));
  halo.setAttribute("fill","rgba(29,78,216,.18)");
  g.appendChild(halo);
  var dot=document.createElementNS(SVGNS,"circle");
  dot.setAttribute("id","meDot");
  dot.setAttribute("cx",w[0]); dot.setAttribute("cy",w[1]); dot.setAttribute("r",String(6/k));
  dot.setAttribute("fill","#1d4ed8"); dot.setAttribute("stroke","#fff"); dot.setAttribute("stroke-width",String(2.4/k));
  g.appendChild(dot);
}
function targetStation(){
  if (!state.city || state.from==null) return null;
  var st=state.city.raw.stations[state.from];
  return st ? {name:st[0], lon:st[2], lat:st[3]} : null;
}
function compassData(){
  var t=targetStation(); if (!t || !geoState.pos) return null;
  return { name:t.name, dist:distM(geoState.pos.lat, geoState.pos.lon, t.lat, t.lon),
           bearing:bearingDeg(geoState.pos.lat, geoState.pos.lon, t.lat, t.lon) };
}
function updateCompass(){
  var fab=document.getElementById("compassFab"); if (!fab) return;
  var t=targetStation();
  if (!t){ fab.hidden=true; return; }
  fab.hidden=false;
  ensureFabLoop();
  var d=compassData(), dst=document.getElementById("fabDist");
  if (!d){ fab.classList.add("idle"); dst.textContent=geoState.on?"定位中":"定位"; return; }
  fab.classList.remove("idle");
  setArrowAngle(d.bearing-headingNow());
  var dtxt=fmtDist(d.dist);
  if (dst.textContent!==dtxt) dst.textContent=dtxt;
  if (document.getElementById("findme").classList.contains("on")) renderFindMe(d);
}
/* 小罗盘没点开时也持续指向：只要它可见，就每帧按最新朝向/位置更新 */
function fabTick(){
  var fab=document.getElementById("compassFab");
  if (!fab || fab.hidden){ fabRAF=0; return; }
  updateCompass();
  fabRAF=requestAnimationFrame(fabTick);
}
function ensureFabLoop(){ if (!fabRAF) fabRAF=requestAnimationFrame(fabTick); }
function renderFindMe(d){
  if (!d) d=compassData();
  var name=targetStation();
  var nameEl=document.getElementById("fmName");
  var ntxt = name ? name.name : "—";
  if (nameEl.textContent!==ntxt) nameEl.textContent=ntxt;
  if (!d){
    var distEl0=document.getElementById("fmDist");
    if (distEl0.textContent!=="—") distEl0.textContent="—";
    var sub0 = geoState.on ? "正在获取定位…" : "需要定位权限才能计算方向";
    var subEl0=document.getElementById("fmSub");
    if (subEl0.textContent!==sub0) subEl0.textContent=sub0;
    return;
  }
  var rel=(d.bearing-headingNow()+360)%360;
  var distEl=document.getElementById("fmDist"), dtxt=fmtDist(d.dist);
  if (distEl.textContent!==dtxt) distEl.textContent=dtxt;
  var sub=relWord(rel)+(headState.abs?"":" · 北向朝上");
  var subEl=document.getElementById("fmSub");
  if (subEl.textContent!==sub) subEl.textContent=sub;
  setArrowAngle(rel);
}
function fmTick(){
  if (!document.getElementById("findme").classList.contains("on")){ fmRAF=0; return; }
  renderFindMe();
  fmRAF=requestAnimationFrame(fmTick);
}
function openFindMe(){
  if (!targetStation()){ setHint("先选择起点站"); return; }
  var el=document.getElementById("findme");
  fmLastFocus=document.activeElement;
  el.classList.add("on");
  if (navigator.vibrate) { try{ navigator.vibrate(8); }catch(e){} }
  startHeading();
  if (!geoState.pos && !geoState.on) startGeo();
  renderFindMe();
  if (!fmRAF) fmRAF=requestAnimationFrame(fmTick);
  setTimeout(function(){ var b=document.getElementById("fmClose"); if (b) b.focus({preventScroll:true}); }, 60);
}
function closeFindMe(){
  var el=document.getElementById("findme");
  if (!el.classList.contains("on")) return;
  el.classList.remove("on");
  if (fmRAF){ cancelAnimationFrame(fmRAF); fmRAF=0; }
  if (fmLastFocus && fmLastFocus.focus){ try{ fmLastFocus.focus({preventScroll:true}); }catch(e){} }
  fmLastFocus=null;
}
function startHeading(){
  if (headState.started) return;
  if (typeof DeviceOrientationEvent==="undefined") return;
  var go=function(){
    headState.started=true;
    window.addEventListener("deviceorientationabsolute", onOrient, true);
    window.addEventListener("deviceorientation", onOrient, true);
  };
  try{
    if (typeof DeviceOrientationEvent.requestPermission==="function"){
      DeviceOrientationEvent.requestPermission().then(function(s){ if (s==="granted") go(); }).catch(function(){});
    } else go();
  }catch(e){}
}
function onOrient(e){
  var h=null;
  if (typeof e.webkitCompassHeading==="number" && !isNaN(e.webkitCompassHeading)){ h=e.webkitCompassHeading; headState.abs=true; }
  else if (e.absolute && typeof e.alpha==="number"){ h=(360-e.alpha)%360; headState.abs=true; }
  if (h==null || !isFinite(h)) return;
  // 罗盘读数抖动较大，做一次低通；用展开角避免 359°↔1° 处跳变
  if (!headState.hasRaw){ headState.raw=h; headState.hasRaw=true; }
  else headState.raw += shortestDelta(headState.raw, h) * 0.28;
  headState.deg=((headState.raw%360)+360)%360;
  headState.available=true;
}
function maybeStartGeo(){
  if (geoState.on || geoState.denied || geoState.starting) return;
  startGeo();
}
function initGeoIfPermitted(){
  if (!navigator.geolocation) return;
  if (!navigator.permissions || !navigator.permissions.query){ return; }
  try{
    navigator.permissions.query({name:"geolocation"}).then(function(st){
      if (st.state==="granted") maybeStartGeo();
      if (st.state==="denied") geoState.denied=true;
      st.onchange=function(){
        if (st.state==="granted") maybeStartGeo();
        if (st.state==="denied") geoState.denied=true;
      };
    }).catch(function(){});
  }catch(e){}
}
function updateLocBtn(){
  var b=document.getElementById("locBtn");
  if (b) b.classList.toggle("locating", !!geoState.on);
}
function startGeo(){
  if (!navigator.geolocation){ setHint("此浏览器不支持定位"); return; }
  if (geoState.on) return;
  geoState.on=true; geoState.starting=true; updateLocBtn(); setHint("正在获取定位…");
  try{
    geoState.watchId=navigator.geolocation.watchPosition(function(p){
      geoState.starting=false; geoState.denied=false;
      geoState.pos={lon:p.coords.longitude, lat:p.coords.latitude, acc:p.coords.accuracy||0};
      geoState.err=null; renderMe(); updateCompass(); checkCityRange();    }, function(err){
      geoState.on=false; geoState.starting=false; geoState.err=err;
      if (err && err.code===1) geoState.denied=true;
      updateLocBtn();
      setHint("定位失败："+(err.code===1?"未授权定位（浏览器需 HTTPS 并允许位置权限）":err.code===2?"暂时无法获取位置":"定位超时"));
    }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  }catch(e){ geoState.on=false; updateLocBtn(); setHint("无法启动定位"); }
}
function stopGeo(){
  if (geoState.watchId!=null && navigator.geolocation) navigator.geolocation.clearWatch(geoState.watchId);
  geoState.watchId=null; geoState.on=false; updateLocBtn();
}
function toggleGeo(){ if (geoState.on) { stopGeo(); setHint("已停止定位"); } else startGeo(); }
function nearestCity(lon, lat){
  var best=null, bd=Infinity;
  for (var i=0;i<DB.cities.length;i++){
    var c=DB.cities[i], st=c.stations, clon=0, clat=0;
    for (var j=0;j<st.length;j++){ clon+=st[j][2]; clat+=st[j][3]; }
    clon/=st.length; clat/=st.length;
    var d=distM(lat, lon, clat, clon);
    if (d<bd){ bd=d; best={id:c.id, name:c.name, dist:d}; }
  }
  return best;
}
function checkCityRange(){
  var nb=document.getElementById("nearBtn");
  if (!nb || !geoState.pos || !state.city) return;
  var me=nearestCity(geoState.pos.lon, geoState.pos.lat);
  var sameCity = me && me.id===state.cityId;
  if (sameCity || !me){ nb.hidden=true; setHint("已定位 · 精度约 "+Math.max(5,Math.round(geoState.pos.acc))+" 米"); return; }
  var here=nearestCity(geoState.pos.lon, geoState.pos.lat);
  var c=state.city, st=c.raw.stations, s=0;
  // 距离当前城市最近车站
  var dmin=Infinity;
  for (var i=0;i<st.length;i++){ var d=distM(geoState.pos.lat,geoState.pos.lon,st[i][3],st[i][2]); if(d<dmin) dmin=d; }
  var g=document.getElementById("gMe"); if (g) g.innerHTML="";
  nb.hidden=false;
  nb.textContent="你距"+esc(c.raw.name)+"约 "+fmtDist(dmin)+" · 切到"+esc(here.name);
  nb.onclick=function(){ setCity(here.id); nb.hidden=true; renderMe(); };
  setHint("你不在当前城市范围内");
}


/* ---------------- 底部面板（移动端三段式） ---------------- */
var panelState = { detent: "collapsed", y: 0 };
function isMobileLayout(){ return window.innerWidth < 980; }
function panelDetentY(d){
  var p = $("panel"); if (!p) return 0;
  var h = p.getBoundingClientRect().height || 1;
  if (d === "full") return Math.round(h * 0.06);
  if (d === "half") return Math.round(h * 0.46);
  return Math.round(Math.max(0, h - 96));
}
function setPanel(d, animate){
  var p = $("panel"); if (!p) return;
  if (!isMobileLayout()){
    p.style.removeProperty("--panel-y");
    p.classList.remove("dragging");
    panelState.detent = "full";
    return;
  }
  panelState.detent = d;
  if (animate === false) p.classList.add("dragging");
  p.style.setProperty("--panel-y", panelDetentY(d) + "px");
  if (animate === false) requestAnimationFrame(function(){ p.classList.remove("dragging"); });
  requestAnimationFrame(function(){ syncMapArea(); });
}

/* 面板高度变化时，把地图可视区同步收缩/展开，并重新贴合当前城市 */
function syncMapArea(yPx){
  var p = $("panel"), wrap = $("mapWrap");
  if (!p || !wrap) return;
  if (!isMobileLayout()){
    p.parentNode.style.removeProperty("--panel-h");
  } else {
    var h = p.getBoundingClientRect().height;
    var y = (yPx != null) ? yPx : panelDetentY(panelState.detent);
    p.parentNode.style.setProperty("--panel-h", Math.max(96, Math.round(h - y)) + "px");
  }
  view.W = wrap.clientWidth || 360;
  view.H = wrap.clientHeight || 300;
  if (!state.city) return;
  if (yPx == null) fitView(); else applyView();
}
function initPanel(){
  var p = $("panel"), g = $("panelGrab");
  if (!p || !g) return;
  setPanel("collapsed");
  var startY = 0, startTop = 0, curY = 0, dragging = false, moved = 0;
  function onDown(e){
    if (!isMobileLayout()) return;
    dragging = true; moved = 0;
    startY = e.clientY;
    startTop = p.getBoundingClientRect().top;
    curY = panelDetentY(panelState.detent);
    p.classList.add("dragging");
    if (g.setPointerCapture) try { g.setPointerCapture(e.pointerId); } catch(err){}
  }
  function onMove(e){
    if (!dragging) return;
    var dy = e.clientY - startY;
    moved += Math.abs(e.movementY || dy);
    var h = p.getBoundingClientRect().height;
    curY = Math.max(h * 0.06, Math.min(h - 96, startTop + dy - p.parentNode.getBoundingClientRect().top));
    p.style.setProperty("--panel-y", Math.round(curY) + "px");
    syncMapArea(curY);
    if (e.cancelable) e.preventDefault();
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    p.classList.remove("dragging");
    if (moved < 8){ setPanel(panelState.detent === "collapsed" ? "half" : "collapsed"); return; }
    var opts = ["full", "half", "collapsed"];
    var best = "collapsed", bd = Infinity;
    for (var i=0;i<opts.length;i++){
      var d = Math.abs(panelDetentY(opts[i]) - curY);
      if (d < bd){ bd = d; best = opts[i]; }
    }
    setPanel(best);
  }
  g.addEventListener("pointerdown", onDown);
  g.addEventListener("pointermove", onMove);
  g.addEventListener("pointerup", onUp);
  g.addEventListener("pointercancel", onUp);
  document.addEventListener("focusin", function(e){
    if (!isMobileLayout()) return;
    if (p.contains(e.target) && panelState.detent === "collapsed") setPanel("half");
  });
  window.addEventListener("resize", function(){
    if (!isMobileLayout()){ p.style.removeProperty("--panel-y"); syncMapArea(); return; }
    setPanel(panelState.detent || "collapsed", false);
  });
  if (window.visualViewport){
    window.visualViewport.addEventListener("resize", function(){
      var kb = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
      document.documentElement.style.setProperty("--kb", kb + "px");
      if (kb > 120 && isMobileLayout() && panelState.detent === "collapsed") setPanel("half");
    });
  }
}

/* ---------------- 路线偏好分段控件 ---------------- */
function syncPrefChips(){
  var seg = $("prefSeg"), sel = $("pref");
  if (!seg || !sel) return;
  var bs = seg.querySelectorAll("[data-pref]");
  for (var i=0;i<bs.length;i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-pref") === sel.value);
  var on = seg.querySelector("button.on");
  if (on){ try { seg.scrollLeft = Math.max(0, on.offsetLeft - (seg.clientWidth - on.offsetWidth) / 2); } catch(e){} }
}

/* 规划按钮：给出加载反馈，但 plan() 本身保持同步 */
function runPlanFeedback(){
  var btn = $("planBtn");
  if (!btn) { plan(); return; }
  btn.dataset.busy = "1";
  requestAnimationFrame(function(){
    setTimeout(function(){
      try { plan(); } finally { btn.dataset.busy = "0"; }
    }, 24);
  });
}

function init(){
  var savedCity=null, savedPref=null;
  try{ savedCity=localStorage.getItem("cm_city"); savedPref=localStorage.getItem("cm_pref"); }catch(e){}
  if(savedPref) { state.pref=savedPref; $("pref").value=savedPref; }
  state.dep=new Date();
  syncTimeControls();
  bind();
  initPanel();
  syncPrefChips();
  initGeoIfPermitted();
  setCity(savedCity && byId.has(savedCity) ? savedCity : "cn-shanghai");
  $("footer").textContent="软件 "+APP_VERSION+" · 数据 "+DATA_VERSION+" · 内置 "+DB.cities.length+" 个城市/地区 · 完全离线";
}
init();
