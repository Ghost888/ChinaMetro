<style>
  /* =====================================================================
     设计系统：语义化令牌 + iOS 式层级
     - 颜色：语义令牌（label/label-2/sep/fill），浅色与深色两套
     - 字号：iOS 文本风格阶梯，rem 基准，跟随浏览器字号缩放
     - 间距：4/8/12/16/20/24 网格；控件最小 44pt
     ===================================================================== */
  :root{
    color-scheme: light dark;
    --bg:#F4F1EA;
    --bg-elevated:#FFFFFF;
    --bg-sheet:#F8F5EF;
    --label:#15171B;
    --label-2:rgba(21,23,27,.62);
    --label-3:rgba(21,23,27,.36);
    --sep:rgba(21,23,27,.10);
    --sep-strong:rgba(21,23,27,.18);
    --fill-1:rgba(120,114,100,.08);
    --fill-2:rgba(120,114,100,.15);
    --tint:#C8102E;
    --ink:#15171B;
    --on-ink:#FFFFFF;
    --blue:#0A66D8;
    --green:#0E7C57;
    --orange:#A85000;
    --red:#C20D1B;
    --map-bg-a:#FBF8F1; --map-bg-b:#EFEBE1;
    --card-shadow:0 1px 2px rgba(20,18,14,.05),0 12px 32px -26px rgba(20,18,14,.55);
    --r-card:14px; --r-sheet:20px; --r-ctl:10px; --r-pill:999px;
    --glass-bg:rgba(250,248,243,.80);
    --glass:saturate(180%) blur(20px);
    --fs-large:2.125rem; --fs-title1:1.75rem; --fs-title2:1.375rem; --fs-title3:1.1875rem;
    --fs-headline:1.0625rem; --fs-body:1.0625rem; --fs-callout:1rem; --fs-subhead:.9375rem;
    --fs-footnote:.8125rem; --fs-caption1:.75rem; --fs-caption2:.6875rem;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121211;
      --bg-elevated:#1E1D1B;
      --bg-sheet:#1A1917;
      --label:#F2EFE8;
      --label-2:rgba(242,239,232,.64);
      --label-3:rgba(242,239,232,.38);
      --sep:rgba(242,239,232,.12);
      --sep-strong:rgba(242,239,232,.22);
      --fill-1:rgba(242,239,232,.07);
      --fill-2:rgba(242,239,232,.14);
      --ink:#F4F1EA;
      --on-ink:#15171B;
      --map-bg-a:#191817; --map-bg-b:#0E0E0D;
      --card-shadow:none;
      --glass-bg:rgba(26,25,23,.76);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;height:100%}
  body{
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    background:var(--bg);color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:var(--fs-body);line-height:1.45;font-optical-sizing:auto;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  b,strong{font-weight:650}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ---------------- 顶部工具栏（功能层） ---------------- */
  .top{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
    background:var(--glass-bg);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
    border-bottom:.5px solid var(--sep);z-index:5
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
  .brand>div{min-width:0}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,#D2112F,#8A0D1F);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:var(--fs-subhead);
    letter-spacing:-.4px;box-shadow:0 4px 12px -8px rgba(138,13,31,.9);flex:0 0 auto}
  .brand b{display:block;font-size:var(--fs-headline);font-weight:700;letter-spacing:-.2px;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:var(--fs-caption2);color:var(--label-2);margin-top:1px;
    letter-spacing:.2px;white-space:nowrap}
  .top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .citybtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 7px;
    border-radius:var(--r-pill);background:var(--fill-1);color:var(--label);cursor:pointer;
    transition:background .15s ease,transform .12s ease}
  .citybtn:active{background:var(--fill-2);transform:scale(.98)}
  .citybtn b{font-size:var(--fs-subhead);font-weight:650}
  .citybtn>span:last-child{color:var(--label-3);font-size:var(--fs-caption1);margin-left:-1px}
  .iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    color:var(--label-2);font-size:var(--fs-title3);transition:background .15s ease}
  .iconbtn:hover{background:var(--fill-1)}
  .iconbtn:active{background:var(--fill-2)}

  /* ---------------- 布局 ---------------- */
  .layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px 0 0}
  .map-wrap{position:relative;flex:0 0 auto;height:42vh;min-height:270px;margin:0 12px;
    border-radius:var(--r-card);overflow:hidden;border:.5px solid var(--sep);
    background:linear-gradient(180deg,var(--map-bg-a),var(--map-bg-b));box-shadow:var(--card-shadow)}
  svg#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;
    -webkit-user-select:none}
  svg#map.grabbing{cursor:grabbing}
  #gTiles image{opacity:.56}
  @media (prefers-color-scheme: dark){
    #gTiles image{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.85);opacity:.42}
    #gLabels text{fill:#EDEAE3;stroke:#0E0E0D}
    #gLabels text[data-onroute]{fill:#fff}
  }
  .mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
  .mapctl button{width:44px;height:44px;border-radius:50%;border:.5px solid var(--sep-strong);
    background:var(--glass-bg);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
    color:var(--label);font-size:var(--fs-title3);line-height:1;display:grid;place-items:center;
    box-shadow:0 6px 16px -12px rgba(0,0,0,.6);transition:transform .12s ease,background .15s ease}
  .mapctl button:active{transform:scale(.94)}
  .mapctl button.on{background:var(--ink);border-color:transparent;color:var(--on-ink)}
  .maptag{position:absolute;left:10px;top:10px;z-index:2;background:var(--glass-bg);
    -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
    border:.5px solid var(--sep);color:var(--label-2);font-size:var(--fs-caption1);font-weight:600;
    padding:6px 10px;border-radius:var(--r-pill);max-width:60%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .osm-attr{position:absolute;left:10px;bottom:10px;z-index:2;font-size:9.5px;line-height:1.35;
    color:var(--label-2);background:var(--glass-bg);-webkit-backdrop-filter:var(--glass);
    backdrop-filter:var(--glass);padding:3px 7px;border-radius:6px;text-decoration:none;
    max-width:56%;border:.5px solid var(--sep);word-break:break-word}
  .osm-attr.off{opacity:.35}
  .hint{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);z-index:3;
    background:rgba(20,20,19,.86);color:#fff;font-size:var(--fs-caption1);font-weight:600;
    padding:8px 14px;border-radius:var(--r-pill);white-space:nowrap;pointer-events:none;
    max-width:56%;overflow:hidden;text-overflow:ellipsis;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .hoverTip{position:absolute;z-index:4;pointer-events:none;background:var(--bg-elevated);
    border:.5px solid var(--sep);border-radius:var(--r-ctl);padding:6px 10px;
    font-size:var(--fs-caption1);color:var(--label);box-shadow:0 8px 24px -16px rgba(0,0,0,.6);
    display:none;white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis}
  .nearbtn{position:absolute;left:10px;bottom:40px;z-index:3;min-height:36px;
    border:.5px solid var(--sep-strong);border-radius:var(--r-pill);background:var(--glass-bg);
    -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
    color:var(--tint);font-size:var(--fs-caption1);font-weight:650;padding:6px 12px;
    box-shadow:0 6px 16px -12px rgba(0,0,0,.5);max-width:74%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .nearbtn[hidden]{display:none}

  /* ---------------- 面板 ---------------- */
  .panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 12px calc(24px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px}
  .panel>*{flex:0 0 auto}
  .card{background:var(--bg-elevated);border-radius:var(--r-card);border:.5px solid var(--sep);
    box-shadow:var(--card-shadow);overflow:hidden}

  /* 行程卡片 */
  .trip{display:flex;flex-direction:column;padding:0}
  .trow{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:54px}
  .trow+.trow{border-top:.5px solid var(--sep)}
  .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-size:var(--fs-caption2);font-weight:700;color:#fff;flex:0 0 auto}
  .dot.from{background:var(--ink);color:var(--on-ink)}
  .dot.to{background:var(--tint)}
  .dot.time{background:var(--label-3)}
  .field{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
  .field i{font-style:normal;font-size:var(--fs-caption2);color:var(--label-2);letter-spacing:.3px}
  .field b{font-size:var(--fs-body);font-weight:650;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .field b.empty{color:var(--label-3);font-weight:500}
  .swap{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--fill-1);
    display:grid;place-items:center;color:var(--label-2);font-size:var(--fs-body);
    transition:transform .15s ease,background .15s ease}
  .swap:active{transform:scale(.92);background:var(--fill-2)}
  .time-edit{display:flex;align-items:center;gap:8px;min-width:0}
  .time-edit input{flex:1;min-width:0;height:32px;border:0;background:transparent;
    font-size:var(--fs-body);font-weight:600;color:var(--label);padding:0}
  .time-edit input::-webkit-calendar-picker-indicator{opacity:.4}
  .pickbtn,.nowbtn{min-height:32px;padding:0 10px;border-radius:var(--r-pill);
    background:var(--fill-1);color:var(--label-2);font-size:var(--fs-caption1);font-weight:650;
    white-space:nowrap;transition:background .15s ease}
  .pickbtn{color:var(--blue)}
  .pickbtn:active,.nowbtn:active{background:var(--fill-2)}
  .opts{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:.5px solid var(--sep)}
  .opts label{font-size:var(--fs-footnote);color:var(--label-2);flex:0 0 auto}
  .opts select{flex:1;min-width:0;height:44px;border:.5px solid var(--sep);border-radius:var(--r-ctl);
    background:var(--bg);color:var(--label);padding:0 10px;font-size:var(--fs-subhead);
    font-weight:550}
  .planbtn{display:block;width:calc(100% - 32px);margin:4px 16px 16px;min-height:50px;
    border-radius:12px;background:var(--ink);color:var(--on-ink);
    font-size:var(--fs-body);font-weight:700;letter-spacing:.2px;
    transition:transform .12s ease,opacity .15s ease}
  .planbtn:active{transform:scale(.985);opacity:.92}

  /* 结果卡片 */
  .result{min-height:110px;padding:16px}
  .empty{color:var(--label-2);font-size:var(--fs-footnote);line-height:1.7}
  .empty b{color:var(--label);font-weight:650}
  .fareline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .fare .num{font-size:2.75rem;font-weight:750;letter-spacing:-1.8px;line-height:1;
    font-variant-numeric:tabular-nums}
  .faresub{font-size:var(--fs-caption1);color:var(--label-2);margin-top:2px}
  .fare .unit{font-size:var(--fs-subhead);font-weight:650;margin-left:3px;color:var(--label-2)}
  .sum{text-align:right;font-size:var(--fs-caption1);line-height:1.6;color:var(--label-2)}
  .sum b{color:var(--label);font-size:var(--fs-headline);font-weight:700;
    font-variant-numeric:tabular-nums}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .badge{font-size:var(--fs-caption1);font-weight:600;background:var(--fill-1);color:var(--label-2);
    border-radius:8px;padding:4px 8px}
  .badge.ok{background:rgba(14,124,87,.12);color:var(--green)}
  .badge.warn{background:rgba(194,13,27,.10);color:var(--red)}
  .badge.info{background:rgba(10,102,216,.10);color:var(--blue)}
  .alt{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .alt button{min-height:40px;min-width:64px;border:.5px solid var(--sep);border-radius:11px;
    background:var(--bg);color:var(--label);padding:7px 10px;line-height:1.25;
    display:flex;flex-direction:column;align-items:flex-start;gap:1px;transition:all .15s ease}
  .alt button b{font-size:var(--fs-caption1);font-weight:700}
  .alt button em{font-style:normal;font-size:var(--fs-caption2);color:var(--label-2)}
  .alt button.on{background:var(--ink);border-color:transparent;color:var(--on-ink)}
  .alt button.on em{color:rgba(255,255,255,.72)}
  @media (prefers-color-scheme: dark){ .alt button.on em{color:rgba(21,23,27,.62)} }
  .legs{margin-top:14px;border-top:.5px solid var(--sep);padding-top:6px}
  .leg{display:flex;gap:12px;padding:12px 0;border-bottom:.5px solid var(--sep)}
  .leg:last-child{border-bottom:0}
  .leg .rail{width:3px;border-radius:2px;flex:0 0 auto;background:var(--fill-2);margin-top:3px}
  .leg .body{flex:1;min-width:0}
  .leg .head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lc{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 7px;
    border-radius:6px;color:#fff;font-size:var(--fs-caption2);font-weight:750;letter-spacing:.2px;
    white-space:nowrap}
  .lc.dark{color:#15171B}
  .leg .route{font-size:var(--fs-footnote);font-weight:650;color:var(--label)}
  .leg .meta{font-size:var(--fs-caption1);color:var(--label-2);margin-top:3px;line-height:1.55}
  .leg .times{font-size:var(--fs-caption2);color:var(--label-3);margin-top:2px;
    font-variant-numeric:tabular-nums}
  .leg.trans .body{font-size:var(--fs-caption1);color:var(--label-2);line-height:1.6}
  .leg.trans .rail{background:transparent;border-left:2px dotted var(--sep-strong)}
  .stopsbox{margin-top:6px}
  .stopsbox summary{cursor:pointer;font-size:var(--fs-caption1);color:var(--blue);
    font-weight:600;list-style:none}
  .stopsbox summary::-webkit-details-marker{display:none}
  .stopsbox summary::after{content:"展开";color:var(--label-3);font-weight:500;margin-left:6px}
  .stopsbox[open] summary::after{content:"收起"}
  .stopsbox ol{margin:6px 0 0 16px;padding:0;font-size:var(--fs-caption1);
    color:var(--label-2);line-height:1.9}
  .warn{margin-top:12px;padding:10px 12px;border-radius:var(--r-ctl);
    background:rgba(194,13,27,.09);color:var(--red);font-size:var(--fs-footnote);line-height:1.6}
  .note{font-size:var(--fs-caption1);color:var(--label-3);line-height:1.6;margin-top:10px}

  /* 数据概览 */
  .facts{padding:16px}
  .facts h3{margin:0 0 10px;font-size:var(--fs-subhead);font-weight:700;color:var(--label)}
  .factgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .fact{background:var(--fill-1);border-radius:var(--r-ctl);padding:9px 10px}
  .fact b{display:block;font-size:var(--fs-title3);font-weight:700;letter-spacing:-.3px;
    font-variant-numeric:tabular-nums}
  .fact span{font-size:var(--fs-caption2);color:var(--label-2)}
  .factnote{font-size:var(--fs-caption1);color:var(--label-2);line-height:1.65;margin-top:12px}
  .datafoot{font-size:var(--fs-caption2);color:var(--label-3);line-height:1.6;padding:0 4px}

  /* ---------------- 半模态面板（sheet） ---------------- */
  .mask{position:fixed;inset:0;background:rgba(8,8,8,.44);z-index:20;display:none;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:0;transition:opacity .22s ease}
  .mask.on{display:block;opacity:1}
  .sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;display:none;flex-direction:column;
    background:var(--bg-sheet);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    max-height:86vh;max-height:86dvh;
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -22px 56px -26px rgba(0,0,0,.55)}
  .sheet.on{display:flex;animation:sheetUp .32s cubic-bezier(.32,.72,0,1)}
  @keyframes sheetUp{from{transform:translateY(14px);opacity:.55}to{transform:none;opacity:1}}
  .sheet-grab{width:36px;height:5px;border-radius:3px;background:var(--label-3);
    margin:8px auto 0;flex:0 0 auto;opacity:.65}
  .sheet-titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:6px 16px 2px;flex:0 0 auto}
  .sheet-titlebar h2{margin:0;font-size:var(--fs-headline);font-weight:700;letter-spacing:-.2px}
  .textbtn{min-height:44px;padding:0 4px;color:var(--blue);font-size:var(--fs-body);
    font-weight:600;white-space:nowrap}
  .textbtn.done{font-weight:700}
  .sheet-head{padding:6px 16px 10px;flex:0 0 auto}
  .sheet-head input{width:100%;height:44px;border-radius:var(--r-ctl);border:.5px solid var(--sep);
    background:var(--bg-elevated);color:var(--label);padding:0 14px;font-size:var(--fs-body);
    outline:none;transition:border-color .15s ease,box-shadow .15s ease}
  .sheet-head input::placeholder{color:var(--label-3)}
  .sheet-head input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,102,216,.15)}
  .sheet-title{padding:6px 16px 2px;font-size:var(--fs-footnote);color:var(--label-2);
    font-weight:600;flex:0 0 auto}

  .list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 20px;
    overscroll-behavior:contain}
  .item{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 12px;
    border-radius:12px;cursor:pointer;transition:background .12s ease}
  .item:active{background:var(--fill-1)}
  .item .nm{font-size:var(--fs-callout);font-weight:600;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .item .sub{font-size:var(--fs-caption1);color:var(--label-2);margin-top:2px}
  .item .right{margin-left:auto;text-align:right;font-size:var(--fs-caption1);
    color:var(--label-3);flex:0 0 auto}
  .item .lines{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}

  .citymark{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;

    box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}

  /* ---------------- 我的位置 · 指向起点 ---------------- */
  .mapctl button.locating{background:var(--blue);border-color:transparent;color:#fff}
  .compass-fab{position:absolute;right:12px;bottom:12px;z-index:4;width:62px;height:62px;

  .compass-fab[hidden]{display:none}
  .compass-fab:active{transform:scale(.94)}

  .fm-name{font-size:1.375rem;font-weight:800;letter-spacing:-.3px;margin-top:3px;line-height:1.2}
  .fm-close{all:unset;box-sizing:border-box;width:46px;height:46px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:1.0625rem;
    color:#fff;flex:0 0 auto;background:rgba(255,255,255,.08);
    transition:background .15s ease,transform .12s ease;text-align:center}
  .fm-close:active{transform:scale(.94);background:rgba(255,255,255,.18)}
  .fm-stage{flex:1;display:grid;place-items:center;min-height:0}
  .fm-ring{position:relative;width:min(74vw,340px);aspect-ratio:1;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.30);display:grid;place-items:center}
  .fm-ring::before{content:"";position:absolute;inset:-1px;border-radius:50%;
    border:2px solid rgba(255,255,255,.22);animation:fmPulse 3.4s ease-out infinite}
  .fm-ring::after{content:"";position:absolute;inset:15%;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.14)}
  @keyframes fmPulse{0%{transform:scale(1);opacity:.5}65%{transform:scale(1.055);opacity:0}100%{opacity:0}}
  .fm-arrow{width:min(45vw,150px);height:min(45vw,150px);color:#fff;transform-origin:50% 50%;
    will-change:transform;filter:drop-shadow(0 10px 22px rgba(0,0,0,.22))}
  .fm-dot{position:absolute;top:-7px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;
    background:#fff;transform-origin:50% calc(min(74vw,340px)/2 + 7px);will-change:transform;
    box-shadow:0 0 0 4px rgba(255,255,255,.16)}
  .fm-bottom{padding-top:6px}
  .fm-label{font-size:var(--fs-caption1);font-weight:600;letter-spacing:.5px;opacity:.72;
    margin-bottom:1px}
  .fm-dist{font-size:clamp(34px,9vw,50px);font-weight:800;letter-spacing:-1.8px;line-height:1.08;
    font-variant-numeric:tabular-nums}
  .fm-sub{font-size:1rem;font-weight:650;opacity:.94;margin-top:6px;letter-spacing:.1px}
  .fm-note{font-size:var(--fs-caption1);opacity:.68;margin-top:14px;line-height:1.65;max-width:34em}

  /* ---------------- 响应式 ---------------- */
  @media (min-width:980px){
    .layout{flex-direction:row;gap:14px;padding:14px 20px 20px;align-items:stretch}
    .map-wrap{flex:1;height:auto;min-height:0;margin:0}
    .panel{width:412px;flex:0 0 412px;padding:0 2px 16px}
    .top{padding:12px 22px;padding-top:calc(12px + env(safe-area-inset-top))}

    .brand small{display:none}

  }

<script>
"use strict";
const DB = /*__DB__*/;
const APP_VERSION = "1.2.0";
const DATA_VERSION = DB.dataVersion;
const byId = new Map(DB.cities.map(function(c){ return [c.id,c]; }));
const runtimeCache = new Map();
const MISSING_CITIES = ["常州","东莞","佛山","绍兴","嘉兴","金华","洛阳","南通","芜湖","台州","泉州","三亚","温州"];
const state = {
  cityId: "cn-shanghai", city: null, from: null, to: null, routes: [], sel: 0,

};
var view = { k: 1, x: 0, y: 0, W: 1, H: 1, baseK: 1 };
var mapWorld = null, mapLayers = null, mapBuildToken = 0;
var cityRuntime = null;
var routeDrawn = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function fmtMin(t){
  if (t == null || !isFinite(t)) return "—";
  var total = Math.round(t), day = Math.floor(total / 1440), m = total - day * 1440;
  var h = Math.floor(m / 60), mm = m % 60;
  return (day > 0 ? "次日 " : "") + pad(h) + ":" + pad(mm);

function fmtDuration(min){
  if (min == null || !isFinite(min)) return "—";
  var m = Math.max(0, Math.round(min));
  if (m < 60) return m + " 分钟";

  if (v == null) return "—";

}
function dateInputValue(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function parseDateInput(v){
  if (!v) return null;

}

  if(prev) prev.textContent=picker.date.getFullYear()+"/"+pad(picker.date.getMonth()+1)+"/"+pad(picker.date.getDate())+" "+pad(picker.hour)+":"+pad(picker.minute);
  var hh=document.getElementById("tpHours"), mm=document.getElementById("tpMinutes");

    var html="";

    var hs=hh.querySelectorAll("[data-h]");

  if(mm){
    var mhtml="";

function dayIndex(d){ return (d.getDay() + 6) % 7; }
function lineName(c, li){ return (c.raw.lines[li] || ["?"])[0]; }

function isLight(hex){
  var h = String(hex || "#888").replace("#","");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];

  return (r*299+g*587+b*114)/1000 > 176;

  var m=(c.raw.lines[li]||[])[4]||"metro";

function stationName(c, si){ return (c.raw.stations[si] || ["?"])[0]; }
function stationEn(c, si){ return (c.raw.stations[si] || ["",""])[1] || ""; }

/* ---------------- city runtime ---------------- */
function getCity(id){
  if (runtimeCache.has(id)) return runtimeCache.get(id);
  var raw = byId.get(id);
  if (!raw) return null;
  var c = { raw: raw, id: id };
  var nSt = raw.stations.length, nStop = raw.stops.length, nLine = raw.lines.length;
  c.stopStation = new Int32Array(nStop);
  c.stopLine = new Int32Array(nStop);
  c.stationStops = new Array(nSt);
  c.stationLines = new Array(nSt);
  for (var i=0;i<nSt;i++){ c.stationStops[i]=[]; c.stationLines[i]=[]; }
  for (var s=0;s<nStop;s++){
    var st=raw.stops[s][0], li=raw.stops[s][1];
    c.stopStation[s]=st; c.stopLine[s]=li;
    c.stationStops[st].push(s);
    if (c.stationLines[st].indexOf(li) < 0) c.stationLines[st].push(li);
  }
  c.linePatterns = new Array(nLine);
  for (var l=0;l<nLine;l++) c.linePatterns[l]=[];
  for (var p=0;p<raw.patterns.length;p++){
    var pat=raw.patterns[p];
    if (c.linePatterns[pat[0]]) c.linePatterns[pat[0]].push(pat);
  }
  c.lineAdj = new Array(nLine);

    maxX=maxX+1; maxY=maxY+1;
  }
  var bx0=p.ox+(minX*ts-p.minX)*p.s, bx1=p.ox+(maxX*ts-p.minX)*p.s;
  var by0=p.oy+(minY*ts-p.minY)*p.s, by1=p.oy+(maxY*ts-p.minY)*p.s;
  var bw=bx1-bx0, bh=by1-by0;
  if(bw<=0||bh<=0) return;
  var kMin=Math.max(view.W/bw,view.H/bh);
  if(view.k<kMin) view.k=kMin;
  // 底图贴着城市裁切，允许小幅越界拖动（否则默认视野下地图完全拖不动），越界处露出纸色底

  view.x=loX<=hiX?Math.min(hiX,Math.max(loX,view.x)):(loX+hiX)/2;
  var loY=view.H-by1*view.k-pad, hiY=-by0*view.k+pad;

}
function applyView(){
  if(state.city) clampTileView(state.city);
  setTransformOnly();
  if (!state.city || !mapLayers) return;
  var c=state.city, k=view.k, base=view.baseK||k, zoom=k/base;
  if(c.lineEls) for(var le=0;le<c.lineEls.length;le++) c.lineEls[le].setAttribute("stroke-width",String(4/k));
  if(state.routeEls) for(var re=0;re<state.routeEls.length;re++) state.routeEls[re].el.setAttribute("stroke-width",String(state.routeEls[re].base/k));
  var rN = (zoom>=1.6 || c.raw.stations.length<=90) ? 2.2/k : 0;
  var rI = zoom>=1.6 ? 3.0/k : 2.6/k;
  for (var i=0;i<c.stationEls.length;i++){
    var el=c.stationEls[i], inter=c.stationLines[i].length>1;
    el.setAttribute("r",String(inter ? rI : rN));
    el.setAttribute("stroke-width",String(1.4/k));
    el.style.display=(!inter && rN===0)?"none":"";
  }
  var routeLabels=state.routeLabels || new Set();
  var showAll=zoom>=2.5 || c.raw.stations.length<=90, showInter=zoom>=1.45 || c.raw.stations.length<=90;
  for (var hid=0;hid<c.labelEls.length;hid++) c.labelEls[hid].style.display="none";
  var items=[];
  for (var j=0;j<c.labelEls.length;j++){
    var linesN=c.stationLines[j].length;
    var pr = routeLabels.has(j)?3 : linesN>=3?2 : linesN>=2?1:0;
    if (pr===0 && !showAll) continue;
    if (pr===1 && !showInter) continue;
    if (pr===2 && !showInter && zoom<1.05) continue;
    var sx=view.x+projectCity(c).px[j]*k, sy=view.y+projectCity(c).py[j]*k;
    if (sx<14||sx>view.W-14||sy<14||sy>view.H-14) continue;
    items.push([pr,j,sx,sy]);
  }
  items.sort(function(a,b){ return b[0]-a[0] || a[1]-b[1]; });
  var placed=[];
  for (var q=0;q<items.length;q++){
    var pr=items[q][0], st=items[q][1], sx2=items[q][2], sy2=items[q][3];
    var name=stationName(c,st), w=name.length*9.6, h=11;
    var box={x:sx2-w/2-2,y:sy2-8-h,w:w+4,h:h+2};
    var hit=false;
    for (var z=0;z<placed.length;z++){ var p=placed[z]; if(!(box.x>p.x+p.w||box.x+box.w<p.x||box.y>p.y+p.h||box.y+box.h<p.y)){hit=true;break;} }
    if (hit && pr<3){ c.labelEls[st].style.display="none"; continue; }
    placed.push(box);
    c.labelEls[st].style.display="";
    c.labelEls[st].setAttribute("font-size",String(9.5/k));
    c.labelEls[st].setAttribute("fill",pr===3?"#111":"#252a33");
    c.labelEls[st].setAttribute("font-weight",pr===3?"750":"600");
    c.labelEls[st].setAttribute("stroke","#fbf8f1");
    c.labelEls[st].setAttribute("stroke-width",String(2.2/k));
    c.labelEls[st].setAttribute("paint-order","stroke");
    c.labelEls[st].setAttribute("x",String(projectCity(c).px[st]));
    c.labelEls[st].setAttribute("y",String(projectCity(c).py[st]-7/k));
  }
  if (geoState.pos) renderMe();
}
function drawRoute(){
  if (!mapLayers || !state.city) return;
  var g=mapLayers.route; g.innerHTML="";
  state.routeEls=[];
  var r=state.routes && state.routes[state.sel];
  state.routeStations=new Set(); state.routeLabels=new Set();
  if (!r) { applyView(); return; }
  var c=state.city, proj=projectCity(c), k=view.k;
  for (var i=0;i<r.legs.length;i++){
    var leg=r.legs[i];
    if (leg.kind !== "ride") continue;
    var d="";
    for (var j=0;j<leg.stations.length;j++){
      var st=c.stopStation[leg.stations[j]];
      d += (j?" L":"M")+proj.px[st]+" "+proj.py[st];
      state.routeStations.add(st);
      if (j===0 || j===leg.stations.length-1) state.routeLabels.add(st);
    }
    var halo=document.createElementNS("http://www.w3.org/2000/svg","path");
    halo.setAttribute("d",d); halo.setAttribute("fill","none"); halo.setAttribute("stroke","#fff");
    halo.setAttribute("stroke-width",String(9/k)); halo.setAttribute("stroke-linecap","round"); halo.setAttribute("stroke-linejoin","round");
    halo.setAttribute("opacity","0.9"); g.appendChild(halo); state.routeEls.push({el:halo,base:9});
    var core=document.createElementNS("http://www.w3.org/2000/svg","path");
    core.setAttribute("d",d); core.setAttribute("fill","none"); core.setAttribute("stroke","#191c22");
    core.setAttribute("stroke-width",String(4.4/k)); core.setAttribute("stroke-linecap","round"); core.setAttribute("stroke-linejoin","round");
    g.appendChild(core); state.routeEls.push({el:core,base:4.4});
  }
  // endpoints
  var ends=[];
  if (state.from!=null) { ends.push([state.from,"起","#191c22"]); state.routeLabels.add(state.from); }
  if (state.to!=null) { ends.push([state.to,"终","#c8102e"]); state.routeLabels.add(state.to); }
  for (var e=0;e<ends.length;e++){
    var st2=ends[e][0];
    var circ=document.createElementNS("http://www.w3.org/2000/svg","circle");
    circ.setAttribute("cx",proj.px[st2]); circ.setAttribute("cy",proj.py[st2]);
    circ.setAttribute("r",String(11/k)); circ.setAttribute("fill",ends[e][2]);
    circ.setAttribute("stroke","#fff"); circ.setAttribute("stroke-width",String(2.2/k));
    g.appendChild(circ);
    var t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",proj.px[st2]); t.setAttribute("y",proj.py[st2]); t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","central"); t.setAttribute("font-size",String(9/k)); t.setAttribute("fill","#fff"); t.setAttribute("font-weight","700");
    t.textContent=ends[e][1]; g.appendChild(t);
  }
  applyView();
}
function zoomAt(sx,sy,factor){
  var k0=view.k, k=Math.max(view.baseK*0.55, Math.min(view.baseK*8, k0*factor));
  var wx=(sx-view.x)/k0, wy=(sy-view.y)/k0;
  view.k=k; view.x=sx-wx*k; view.y=sy-wy*k;
  applyView();
}
function nearestStation(px,py){
  var c=state.city; if(!c) return null;
  var proj=projectCity(c), best=null, bd=16*16;
  for (var i=0;i<proj.px.length;i++){
    var sx=view.x+proj.px[i]*view.k, sy=view.y+proj.py[i]*view.k;
    var dx=sx-px, dy=sy-py, d=dx*dx+dy*dy;
    if (d<bd){ bd=d; best=i; }
  }
  return best;
}
function localPt(e){
  var r=$("mapWrap").getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function plan(){
  renderTrip();
  if (state.from!=null && state.to!=null && state.from===state.to){ state.routes=[]; state.sel=0; renderResult(); drawRoute(); return; }
  if (state.from==null || state.to==null) return;
  var c=state.city;
  var routes=computeRoutes(c,state.from,state.to,state.dep);
  if (!routes.length){ state.routes=[]; state.sel=0; renderResult(); drawRoute(); return; }
  // preference order
  var pref=state.pref;
  if (pref==="fare"){
    routes.sort(function(a,b){ var av=a.fare?a.fare.value:1e9, bv=b.fare?b.fare.value:1e9; return av!==bv?av-bv:(a.plan.ok?0:1)-(b.plan.ok?0:1); });
  } else {
    routes.sort(function(a,b){
      var ap=a.plan.ok?0:1, bp=b.plan.ok?0:1;
      if (ap!==bp) return ap-bp;
      return a.cost-b.cost;
    });
  }
  var wanted=pref==="fare"?null:pref==="few"?"few":pref==="stops"?"stops":pref==="walk"?"walk":"fast";
  var idx=wanted?routes.findIndex(function(r){return r.mode===wanted;}):0;

}

  $("locBtn").onclick=toggleGeo;
  $("compassFab").onclick=openFindMe;
  $("fmClose").onclick=closeFindMe;
  // pointer drag/zoom
  var pointers=new Map(), drag=null, start=null, moved=0, pinch=null;
  var svg=$("map");
  svg.addEventListener("pointerdown",function(e){
    svg.setPointerCapture(e.pointerId);
    var p=localPt(e); pointers.set(e.pointerId,p);
    if(pointers.size===1){ drag=true; moved=0; start=p; svg.classList.add("grabbing"); }
    else if(pointers.size===2){
      var a=Array.from(pointers.values()); pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),k:view.k,x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,vx:view.x,vy:view.y}; drag=false;
    }
  });
  svg.addEventListener("pointermove",function(e){
    var p=localPt(e);
    if(pointers.has(e.pointerId)){
      var prev=pointers.get(e.pointerId); pointers.set(e.pointerId,p);
      if(pointers.size===2 && pinch){
        var a=Array.from(pointers.values()); var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
        var mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
        var k=Math.max(view.baseK*0.55,Math.min(view.baseK*8,pinch.k*d/(pinch.d||1)));
        var wx=(pinch.x-pinch.vx)/pinch.k, wy=(pinch.y-pinch.vy)/pinch.k;
        view.k=k; view.x=mid.x-wx*k; view.y=mid.y-wy*k; applyView(); return;
      }
      if(drag){
        var dx=p.x-prev.x, dy=p.y-prev.y; moved+=Math.abs(dx)+Math.abs(dy);
        view.x+=dx; view.y+=dy; clampTileView(state.city); setTransformOnly();
      }
    } else {
      var s=nearestStation(p.x,p.y), tip=$("hoverTip");
      if(s==null){ tip.style.display="none"; }
      else { tip.textContent=stationName(state.city,s)+" · "+state.city.stationLines[s].map(function(l){return lineName(state.city,l);}).join(" / "); tip.style.display="block"; tip.style.left=(p.x+12)+"px"; tip.style.top=(p.y-10)+"px"; }
    }
  });
  function endPointer(e){
    var p=pointers.get(e.pointerId); pointers.delete(e.pointerId);
    if(pointers.size<2) pinch=null;
    if(pointers.size===0){
      svg.classList.remove("grabbing");
      if(drag && moved<9 && p){
        var s=nearestStation(p.x,p.y);
        if(s!=null){
          if(state.from==null || (state.from!=null&&state.to!=null)) selectStation("from",s);
          else selectStation("to",s);
        }
      }
      drag=false;
    }
  }
  svg.addEventListener("pointerup",endPointer);
  svg.addEventListener("pointercancel",function(e){ pointers.delete(e.pointerId); pinch=null; drag=false; svg.classList.remove("grabbing"); });
  svg.addEventListener("pointerleave",function(){ $("hoverTip").style.display="none"; });
  $("mapWrap").addEventListener("wheel",function(e){ e.preventDefault(); var p=localPt(e); zoomAt(p.x,p.y,Math.exp(-e.deltaY*0.0016)); },{passive:false});
  window.addEventListener("resize",function(){ if(state.city){ view.W=$("mapWrap").clientWidth||360; view.H=$("mapWrap").clientHeight||300; fitView(); } });
}

/* ---------------- 我的位置 · 指向起点 ---------------- */
var SVGNS = "http://www.w3.org/2000/svg";
var geoState = { on: false, watchId: null, pos: null, err: null };
var headState = { deg: 0, raw: 0, hasRaw: false, abs: false, started: false, available: false };
var fmRAF = 0, fabRAF = 0;
var rotState = { shown: 0, init: false, applied: null };
var fmLastFocus = null;

function shortestDelta(from, to){ return ((to - from + 540) % 360) - 180; }
/* CSS 的 rotate() 是数值插值：359°→1° 会倒着转一整圈。
   这里把角度展开成连续值，只走最短弧，罗盘转到正北时就不会再快速反转一圈。 */
function setArrowAngle(rel){
  rel = ((rel % 360) + 360) % 360;
  if (!rotState.init){ rotState.shown = rel; rotState.init = true; }
  else rotState.shown += shortestDelta(rotState.shown, rel);
  var t = "rotate(" + rotState.shown.toFixed(2) + "deg)";
  if (rotState.applied !== t){
    rotState.applied = t;
    var a = document.getElementById("fabArrow"); if (a) a.style.transform = t;
    var b = document.getElementById("fmArrow"); if (b) b.style.transform = t;
    var d = document.getElementById("fmDot"); if (d) d.style.transform = t;
  }
}

/* 城市标志色：取该城出现次数最多的线路颜色，配白色两字徽标 */
function cityRawColor(raw){
  var lines = (raw && raw.lines) || [], counts = {}, best = null, bn = 0;
  for (var i=0;i<lines.length;i++){
    var col = (lines[i]||[])[2];
    if (!col || col.charAt(0)!="#") continue;
    counts[col] = (counts[col]||0) + 1;
    if (counts[col] > bn){ bn = counts[col]; best = col; }
  }
  return best || "#5b6068";
}
function cityMarkHTML(raw, cls){
  var nm = (raw && raw.name) || "";
  var t = nm.length <= 2 ? nm : nm.slice(0,2);
  return '<span class="citymark '+(cls||'')+'" style="background:'+cityRawColor(raw)+'">'+esc(t)+'</span>';
}

function mercYof(lat){ return (1-Math.log(Math.tan(Math.PI/4+lat*Math.PI/360))/Math.PI)/2; }
function geoToWorld(c, lon, lat){
  var p = projectCity(c);
  return [p.ox+((lon+180)/360-p.minX)*p.s, p.oy+(mercYof(lat)-p.minY)*p.s];
}
function distM(lat1, lon1, lat2, lon2){
  var R=6371000, p1=lat1*Math.PI/180, p2=lat2*Math.PI/180;
  var dp=(lat2-lat1)*Math.PI/180, dl=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
function bearingDeg(lat1, lon1, lat2, lon2){
  var p1=lat1*Math.PI/180, p2=lat2*Math.PI/180, dl=(lon2-lon1)*Math.PI/180;
  var y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function fmtDist(m){
  if (!isFinite(m)) return "—";
  if (m < 1000) return (Math.round(m/10)*10)+" 米";
  return (m/1000).toFixed(m<10000?1:0)+" 公里";
}
function relWord(rel){
  var a=((rel%360)+360)%360, x=a>180?360-a:a;
  if (x<15) return "正前方";
  if (x<50) return a>180?"左前方":"右前方";
  if (x<130) return a>180?"左侧":"右侧";
  if (x<165) return a>180?"左后方":"右后方";
  return "正后方";
}
function headingNow(){ return headState.available && headState.abs ? headState.deg : 0; }

function meLayer(){
  if (!mapLayers || !mapLayers.vectorWorld) return null;
  var g = document.getElementById("gMe");
  if (!g){ g = document.createElementNS(SVGNS,"g"); g.setAttribute("id","gMe"); mapLayers.vectorWorld.appendChild(g); }
  return g;
}
function renderMe(){
  if (!mapLayers || !state.city) return;
  var g = meLayer(); if (!g) return;
  g.innerHTML="";
  if (!geoState.pos) return;
  var c=state.city, w=geoToWorld(c, geoState.pos.lon, geoState.pos.lat), k=view.k||1;
  var s=projectCity(c).s;
  var worldPerMeter = s/(111320*Math.max(0.05,Math.cos(geoState.pos.lat*Math.PI/180))*360);
  var accR = geoState.pos.acc*worldPerMeter;
  if (isFinite(accR) && accR>0 && accR<3){
    var ac=document.createElementNS(SVGNS,"circle");
    ac.setAttribute("cx",w[0]); ac.setAttribute("cy",w[1]); ac.setAttribute("r",String(accR));
    ac.setAttribute("fill","rgba(29,78,216,.14)"); ac.setAttribute("stroke","rgba(29,78,216,.32)");
    ac.setAttribute("stroke-width",String(1/k));
    g.appendChild(ac);
  }
  var halo=document.createElementNS(SVGNS,"circle");
  halo.setAttribute("cx",w[0]); halo.setAttribute("cy",w[1]); halo.setAttribute("r",String(11/k));
  halo.setAttribute("fill","rgba(29,78,216,.18)");
  g.appendChild(halo);
  var dot=document.createElementNS(SVGNS,"circle");
  dot.setAttribute("id","meDot");
  dot.setAttribute("cx",w[0]); dot.setAttribute("cy",w[1]); dot.setAttribute("r",String(6/k));
  dot.setAttribute("fill","#1d4ed8"); dot.setAttribute("stroke","#fff"); dot.setAttribute("stroke-width",String(2.4/k));
  g.appendChild(dot);
}
function targetStation(){
  if (!state.city || state.from==null) return null;
  var st=state.city.raw.stations[state.from];
  return st ? {name:st[0], lon:st[2], lat:st[3]} : null;
}
function compassData(){
  var t=targetStation(); if (!t || !geoState.pos) return null;
  return { name:t.name, dist:distM(geoState.pos.lat, geoState.pos.lon, t.lat, t.lon),
           bearing:bearingDeg(geoState.pos.lat, geoState.pos.lon, t.lat, t.lon) };
}
function updateCompass(){
  var fab=document.getElementById("compassFab"); if (!fab) return;
  var t=targetStation();
  if (!t){ fab.hidden=true; return; }
  fab.hidden=false;
  ensureFabLoop();
  var d=compassData(), dst=document.getElementById("fabDist");
  if (!d){ fab.classList.add("idle"); dst.textContent=geoState.on?"定位中":"定位"; return; }
  fab.classList.remove("idle");
  setArrowAngle(d.bearing-headingNow());
  var dtxt=fmtDist(d.dist);
  if (dst.textContent!==dtxt) dst.textContent=dtxt;
  if (document.getElementById("findme").classList.contains("on")) renderFindMe(d);
}
/* 小罗盘没点开时也持续指向：只要它可见，就每帧按最新朝向/位置更新 */
function fabTick(){
  var fab=document.getElementById("compassFab");
  if (!fab || fab.hidden){ fabRAF=0; return; }
  updateCompass();
  fabRAF=requestAnimationFrame(fabTick);
}
function ensureFabLoop(){ if (!fabRAF) fabRAF=requestAnimationFrame(fabTick); }
function renderFindMe(d){
  if (!d) d=compassData();
  var name=targetStation();
  var nameEl=document.getElementById("fmName");
  var ntxt = name ? name.name : "—";
  if (nameEl.textContent!==ntxt) nameEl.textContent=ntxt;
  if (!d){
    var distEl0=document.getElementById("fmDist");
    if (distEl0.textContent!=="—") distEl0.textContent="—";
    var sub0 = geoState.on ? "正在获取定位…" : "需要定位权限才能计算方向";
    var subEl0=document.getElementById("fmSub");
    if (subEl0.textContent!==sub0) subEl0.textContent=sub0;
    return;
  }
  var rel=(d.bearing-headingNow()+360)%360;
  var distEl=document.getElementById("fmDist"), dtxt=fmtDist(d.dist);
  if (distEl.textContent!==dtxt) distEl.textContent=dtxt;
  var sub=relWord(rel)+(headState.abs?"":" · 北向朝上");
  var subEl=document.getElementById("fmSub");
  if (subEl.textContent!==sub) subEl.textContent=sub;
  setArrowAngle(rel);
}
function fmTick(){
  if (!document.getElementById("findme").classList.contains("on")){ fmRAF=0; return; }
  renderFindMe();
  fmRAF=requestAnimationFrame(fmTick);
}
function openFindMe(){
  if (!targetStation()){ setHint("先选择起点站"); return; }
  var el=document.getElementById("findme");
  fmLastFocus=document.activeElement;
  el.classList.add("on");
  if (navigator.vibrate) { try{ navigator.vibrate(8); }catch(e){} }
  startHeading();
  if (!geoState.pos && !geoState.on) startGeo();
  renderFindMe();
  if (!fmRAF) fmRAF=requestAnimationFrame(fmTick);
  setTimeout(function(){ var b=document.getElementById("fmClose"); if (b) b.focus({preventScroll:true}); }, 60);
}
function closeFindMe(){
  var el=document.getElementById("findme");
  if (!el.classList.contains("on")) return;
  el.classList.remove("on");
  if (fmRAF){ cancelAnimationFrame(fmRAF); fmRAF=0; }
  if (fmLastFocus && fmLastFocus.focus){ try{ fmLastFocus.focus({preventScroll:true}); }catch(e){} }
  fmLastFocus=null;
}
function startHeading(){
  if (headState.started) return;
  if (typeof DeviceOrientationEvent==="undefined") return;
  var go=function(){
    headState.started=true;
    window.addEventListener("deviceorientationabsolute", onOrient, true);
    window.addEventListener("deviceorientation", onOrient, true);
  };
  try{
    if (typeof DeviceOrientationEvent.requestPermission==="function"){
      DeviceOrientationEvent.requestPermission().then(function(s){ if (s==="granted") go(); }).catch(function(){});
    } else go();
  }catch(e){}
}
function onOrient(e){
  var h=null;
  if (typeof e.webkitCompassHeading==="number" && !isNaN(e.webkitCompassHeading)){ h=e.webkitCompassHeading; headState.abs=true; }
  else if (e.absolute && typeof e.alpha==="number"){ h=(360-e.alpha)%360; headState.abs=true; }
  if (h==null || !isFinite(h)) return;
  // 罗盘读数抖动较大，做一次低通；用展开角避免 359°↔1° 处跳变
  if (!headState.hasRaw){ headState.raw=h; headState.hasRaw=true; }
  else headState.raw += shortestDelta(headState.raw, h) * 0.28;
  headState.deg=((headState.raw%360)+360)%360;
  headState.available=true;
}
function updateLocBtn(){
  var b=document.getElementById("locBtn");
  if (b) b.classList.toggle("locating", !!geoState.on);
}
function startGeo(){
  if (!navigator.geolocation){ setHint("此浏览器不支持定位"); return; }
  if (geoState.on) return;
  geoState.on=true; updateLocBtn(); setHint("正在获取定位…");
  try{
    geoState.watchId=navigator.geolocation.watchPosition(function(p){
      geoState.pos={lon:p.coords.longitude, lat:p.coords.latitude, acc:p.coords.accuracy||0};
      geoState.err=null; renderMe(); updateCompass(); checkCityRange();    }, function(err){
      geoState.on=false; geoState.err=err; updateLocBtn();
      setHint("定位失败："+(err.code===1?"未授权定位（浏览器需 HTTPS 并允许位置权限）":err.code===2?"暂时无法获取位置":"定位超时"));
    }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  }catch(e){ geoState.on=false; updateLocBtn(); setHint("无法启动定位"); }
}
function stopGeo(){
  if (geoState.watchId!=null && navigator.geolocation) navigator.geolocation.clearWatch(geoState.watchId);
  geoState.watchId=null; geoState.on=false; updateLocBtn();
}
function toggleGeo(){ if (geoState.on) { stopGeo(); setHint("已停止定位"); } else startGeo(); }
function nearestCity(lon, lat){
  var best=null, bd=Infinity;
  for (var i=0;i<DB.cities.length;i++){
    var c=DB.cities[i], st=c.stations, clon=0, clat=0;
    for (var j=0;j<st.length;j++){ clon+=st[j][2]; clat+=st[j][3]; }
    clon/=st.length; clat/=st.length;
    var d=distM(lat, lon, clat, clon);
    if (d<bd){ bd=d; best={id:c.id, name:c.name, dist:d}; }
  }
  return best;
}
function checkCityRange(){
  var nb=document.getElementById("nearBtn");
  if (!nb || !geoState.pos || !state.city) return;
  var me=nearestCity(geoState.pos.lon, geoState.pos.lat);
  var sameCity = me && me.id===state.cityId;
  if (sameCity || !me){ nb.hidden=true; setHint("已定位 · 精度约 "+Math.max(5,Math.round(geoState.pos.acc))+" 米"); return; }
  var here=nearestCity(geoState.pos.lon, geoState.pos.lat);
  var c=state.city, st=c.raw.stations, s=0;
  // 距离当前城市最近车站
  var dmin=Infinity;
  for (var i=0;i<st.length;i++){ var d=distM(geoState.pos.lat,geoState.pos.lon,st[i][3],st[i][2]); if(d<dmin) dmin=d; }
  var g=document.getElementById("gMe"); if (g) g.innerHTML="";
  nb.hidden=false;
  nb.textContent="你距"+esc(c.raw.name)+"约 "+fmtDist(dmin)+" · 切到"+esc(here.name);
  nb.onclick=function(){ setCity(here.id); nb.hidden=true; renderMe(); };
  setHint("你不在当前城市范围内");
}

function init(){
  var savedCity=null, savedPref=null;
  try{ savedCity=localStorage.getItem("cm_city"); savedPref=localStorage.getItem("cm_pref"); }catch(e){}
  if(savedPref) { state.pref=savedPref; $("pref").value=savedPref; }
  state.dep=new Date();
  syncTimeControls();
  bind();
  setCity(savedCity && byId.has(savedCity) ? savedCity : "cn-shanghai");
  $("footer").textContent="软件 "+APP_VERSION+" · 数据 "+DATA_VERSION+" · 内置 "+DB.cities.length+" 个城市/地区 · 完全离线";
}
init();
</script>
